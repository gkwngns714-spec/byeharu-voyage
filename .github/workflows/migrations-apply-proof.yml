name: Migrations — apply proof (PGlite gate + disposable Supabase)

# WHAT THIS PROVES, IN TWO JOBS THAT PROVE DIFFERENT THINGS
#
#   Neither job replaces the other. Running only one of them would leave a real class of defect
#   uncaught, and the two classes are named below so nobody has to guess.
#
# ── JOB 1: pglite-gate ─────────────────────────────────────────────────────────────────────────
#   Applies the ENTIRE migration chain to a real PostgreSQL 18 compiled to WebAssembly
#   (@electric-sql/pglite) — real planner, real plpgsql, real constraints, real triggers, real
#   GRANTs — and then runs every proof in scripts/db/proofs/ inside transactions that are rolled
#   back. Since 2026-10-13 (row 124) the chain's world comes from the PREFIX CACHE: the longest
#   already-applied prefix is restored from a verified snapshot and only the files after it are
#   applied here, self-asserts and all (see the step below; scripts/db/prefix-cache.mjs). The
#   from-zero apply is job 2's, on a real Postgres, nightly (and whenever the chain machinery
#   changed; see job 2). On main this job restores the previous main run's entry (restore-keys)
#   and applies the merged files — measured 2026-10-17 (run 39040210150): 133 of 134 restored in
#   3.2 s, 1 applied, the leg done in 4m24s.
#   It is the same gate the developer runs on their own machine in ten seconds
#   (`npm run db:apply` / `npm run db:proof`), which is why a migration should never reach job 2
#   red.
#
#   Its non-vacuity floors are what make it a gate rather than a formality:
#     * every migration must print a "self-assert ok:" receipt, or the run fails;
#     * every proof must declare "-- @pass MARKER" lines and every declared marker must actually
#       appear in the output. A proof that quietly stopped emitting a marker FAILS. A proof that
#       declares nothing FAILS as vacuous.
#     * a proof that leaves committed rows behind FAILS, so the rollback is verified rather than
#       assumed.
#
#   Since 2026-08-18 it applies scripts/db/supabase-preamble.sql first: the Supabase roles and the
#   ALTER DEFAULT PRIVILEGES a real project ships, under a grantor that is not the migration role.
#   Before that preamble existed this job — and the developer's local run — passed the whole
#   grant/default-ACL family of asserts VACUOUSLY, on an empty database with nothing to find, while
#   job 2 failed 0001 with 16 default-ACL entries to find (DEV_LOG D8).
#
#   What it STILL cannot prove: it is not Supabase. The preamble models roles and default ACLs and
#   nothing else — no GoTrue, no PostgREST, no Realtime, no Storage, no `pg_cron`, no real `auth`
#   schema, no hosted extension set, and the migration role here is a superuser where on Supabase
#   it is not. Anything that depends on those is still job 2's alone.
#
# ── JOB 2: disposable-chain ────────────────────────────────────────────────────────────────────
#   `supabase start` boots a disposable stack in Docker inside the runner and applies every file
#   in supabase/migrations/ in version order — against Supabase's OWN roles and its own default
#   privileges. Any error (a syntax error, a broken dependency on an earlier migration, a violated
#   CHECK, a `raise exception` from a self-assert) fails the job.
#
#   SINCE 2026-10-15 a PR restores a green snapshot whose manifest is an exact prefix of its chain
#   and applies only the files after it, through the CLI's own `migration up` (see the steps below
#   and scripts/ci/supabase-snapshot.sh). Trade-off, stated: an OLD file's from-zero apply is
#   proven by the from-zero run, not re-proven on each PR — which is only a loss if that file
#   changed, and a changed file breaks the prefix.
#
#   SINCE 2026-10-18 MAIN BUILDS ON ITS OWN SNAPSHOT TOO (owner: "CI never starts from scratch;
#   always make CI fast; save everything you checked"). A push to main runs the same `choose` a PR
#   runs — the longest kept snapshot that is an exact prefix of main's chain, by exact key, no wait
#   — applies the merged files on it, and KEEPS the result as the snapshot the next PR and the next
#   main run restore. Measured before: main's from-zero apply was 47 of its 49 minutes
#   (run 39040210150, 14:28 -> 15:16), and with several merges an hour main's runs queued and
#   cancelled each other (10 of the 12 main runs of 14:18-15:16 on 2026-10-17 were cancelled while
#   pending), so every PR waited on one 50-minute run. Now each push to main has its OWN
#   concurrency group (below), so every merge's run completes and leaves its snapshot.
#
#   THE FROM-ZERO NET STILL EXISTS, ONE A DAY: the `schedule` below (03:23 KST), any
#   workflow_dispatch, and a push to main whose diff changed the chain machinery or an old
#   migration (select's `cold`, the growth rule) apply the whole chain from 0001 on a fresh volume,
#   and their green snapshot is kept like any other. A red nightly is a red like any red: read it.
#
#   THE LAW (owner, 2026-10-17; docs/CI.md): A PULL REQUEST NEVER APPLIES THE CHAIN FROM ZERO.
#   Since 2026-10-17 a PR (1) waits, bounded, for main's own run on its base commit if that run is
#   still going and its snapshot is not kept yet, (2) restores the LONGEST kept snapshot that is a
#   prefix of its chain — looked up by key among ALL kept snapshots, not "the newest" (PR #147 got
#   the newest, a non-prefix, and applied 132 files from zero while the right one was saved two
#   minutes later), and (3) if nothing usable exists, FAILS with the reason instead of applying
#   from zero. The one exemption: a PR that changed the chain machinery or an old migration
#   (`select`'s `cold`, from select-specs.mjs's growth rule) may apply from zero, and says so.
#   The same law governs the pglite legs' prefix cache (BYEHARU_PREFIX_CACHE=required).
#
#   It then re-runs the grant-lockdown proof by hand against that database, because that proof is
#   the one whose result differs between the two environments, and asserts every PASS marker
#   appears. Green is NOT "psql exited 0"; green is "every named marker was printed".
#
# ── WHAT NEITHER JOB DOES, AND MUST NEVER DO ───────────────────────────────────────────────────
#   Touch a hosted project. There is no `environment:` on either job, so neither can read
#   production secrets even by accident. Both databases are created and destroyed inside the
#   runner. Deploying to a real project is a separate, deliberate, human-approved workflow.

on:
  push:
    branches: [main]
  # EVERY pull request, no `paths:` filter (2026-10-17). `disposable-chain` is a REQUIRED check on
  # main, and a workflow that a paths filter keeps from running reports nothing — its required
  # check stays "Expected" forever and the PR can never merge (PR #153, a chart change; PR #161,
  # a design doc). So the workflow runs on every PR and the `select` job decides, from the same
  # diff it already reads, whether the PR touches the database at all (its `db` output). When it
  # does not, both proof jobs are skipped by a job-level `if:` — GitHub reports a job skipped by
  # its `if:` as SUCCESS, and a required check that is skipped that way satisfies the branch
  # protection (docs: "Using conditions to control job execution"). A PR that does touch the
  # database runs exactly what it ran before.
  pull_request:
  # A dispatch is a from-zero apply (the net), like the schedule.
  workflow_dispatch:
  # THE NIGHTLY FROM-ZERO NET (2026-10-18): 18:23 UTC = 03:23 KST, once a day, the whole chain from
  # 0001 on a fresh volume, on main. Every other run builds on a kept snapshot.
  schedule:
    - cron: '23 18 * * *'

# A newer push to a PR cancels the older run. A push to MAIN never cancels one (2026-10-15), and
# since 2026-10-18 each push to main is its OWN group: GitHub keeps at most ONE PENDING run per
# group, so with a shared group and cancel-in-progress false, every merge in a busy hour still
# cancelled the pending one before it — 10 of the 12 main runs between 14:18 and 15:16 on
# 2026-10-17 ended "cancelled" without starting, and only the first and the last applied. A
# cancelled main run leaves no snapshot and no proof of its commit. Per-sha groups let every
# merge's run complete, side by side; now that a main run builds on a snapshot (minutes, not 50),
# that costs little. Dispatch and schedule runs share the ref's group and queue as before.
concurrency:
  group: migrations-apply-proof-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── WHICH pglite LEGS A PR RUNS (2026-10-17, the owner's "test only where we made something new")
  # scripts/ci/select-specs.mjs — the same one authority acceptance.yml's `select` job uses —
  # decides it from the PR's diff against its merge commit's first parent:
  #   * `the rest` (grant lockdown, offline equivalence, first session and seven more; minutes)
  #     ALWAYS runs. Every new migration's apply, its self-assert receipt and the world guard run
  #     inside every leg, so this one leg carries them on every PR.
  #   * `ledger` (02, ~5 min) and `merchants` (12, ~11 min) run when an ADDED migration defines or
  #     mentions a qualified name (`public.port_offers`, `cmd.issue`, a table it writes) that the
  #     proof file names; when the proof file itself changed; or on any change to scripts/db/**,
  #     package(-lock).json or an edited (not added) migration. On main, and on dispatch: all three.
  # A skipped leg still reports success under its own name, and its log says why it did not run.
  # disposable-chain runs every leg of its own: it is already scoped (a PR, and since 2026-10-18 a
  # push to main, applies only its new files on a kept snapshot) and it is the only check that
  # runs against Supabase's own roles. It reads this job's `cold` output: on a PR the law's
  # exemption, on a push to main the decision to run the from-zero NET instead (header, JOB 2).
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      legs: ${{ steps.sel.outputs.legs }}
      # 'false' only when this run has a diff (a pull request, or a push whose previous commit is
      # known) and that diff touches none of the database paths below. Anything else — a dispatch,
      # the schedule, a diff that reaches the database, or a step that did not get as far as
      # writing the output — leaves it != 'false', and the jobs run.
      db: ${{ steps.db.outputs.db }}
      # 'true' only when the chain machinery or an old migration changed (selection.json's
      # growth.run, from the PR's diff or the push's own diff): on a PR the law's one exemption (a
      # from-zero apply is allowed, and logged); on a push to main the from-zero NET runs instead
      # of the snapshot build. Always 'true' on a dispatch, the nightly schedule, or a push whose
      # previous commit GitHub did not name.
      cold: ${{ steps.sel.outputs.cold }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # ONE answer to "what did this run change?", read by both steps below. A pull request: the
      # merge commit against its first parent. A push: against the commit the branch stood at
      # before (github.event.before — HEAD^1 would miss the earlier commits of a multi-commit
      # push), fetched shallow. Empty = no diff (dispatch, schedule, a push with no known before):
      # everything runs, from zero.
      - name: What is this run's diff against?
        id: base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request) base=$(git rev-parse HEAD^1) ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git fetch --quiet --depth=1 origin "$BEFORE"; then
                base=""; echo "the commit before this push is not known ('$BEFORE'): no diff — everything runs, from zero (the safe side)"
              else
                base=$BEFORE
              fi ;;
            *) base="" ;;
          esac
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "diff base: ${base:-(none: ${{ github.event_name }})}"

      - name: Does this run touch the database at all?
        id: db
        # The paths are the former `paths:` filter of this workflow, plus everything the two jobs
        # below actually execute: scripts/ci/** (select-specs.mjs, supabase-snapshot.sh) and
        # src/lib/db/** (apply-chain.mjs and prefix-cache.mjs import the chain engine from there),
        # and package-lock.json (the gate's dependencies are installed from it).
        # Since 2026-10-18 a PUSH to main is judged the same way: a merge that changed none of
        # these leaves the chain, the preamble and the machinery byte-identical to the previous
        # main commit's, whose own run proved them and keeps their snapshot — there is nothing new
        # to apply and nothing new to keep, so both proof jobs are skipped there too.
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "no diff to judge (${{ github.event_name }}): every job runs, from zero"; exit 0
          fi
          hits=$(git diff --name-only "$BASE" HEAD -- \
            supabase scripts/db scripts/ci src/lib/db \
            package.json package-lock.json .github/workflows/migrations-apply-proof.yml)
          if [ -n "$hits" ]; then
            echo "db=true" >> "$GITHUB_OUTPUT"
            echo "this ${{ github.event_name }} touches the database; the proof jobs run:"
            echo "$hits"
          else
            echo "db=false" >> "$GITHUB_OUTPUT"
            echo "this ${{ github.event_name }} changes no file under supabase/, scripts/db/, scripts/ci/, src/lib/db/, nor package(-lock).json nor this workflow:"
            echo "pglite-gate and disposable-chain are skipped by their job-level if:, which GitHub reports as success (on a PR the required check is satisfied; on main the previous commit's snapshot already IS this chain's). The whole diff:"
            git diff --name-only "$BASE" HEAD
          fi

      - name: Which pglite legs this run needs, and why — and whether this run applies from zero
        id: sel
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/select-specs.mjs --base "$BASE" --head HEAD --out selection.json | grep -E '^(diff|  [A-Z] |sql |  defines|  tables|  mentions|pglite-gate)'
          else
            # Every leg runs on main, on a dispatch and on the schedule.
            node scripts/ci/select-specs.mjs --full --out selection.json | grep -E '^pglite-gate'
          fi
          echo "legs=$(jq -c '.pglite | with_entries(.value |= (length > 0))' selection.json)" >> "$GITHUB_OUTPUT"
          jq -c '.pglite | with_entries(.value |= (length > 0))' selection.json
          # FROM ZERO OR NOT: the same growth rule, on this run's diff. On a PR it is the law's
          # exemption; on a push to main it decides whether this run is the from-zero NET or builds
          # on the kept snapshot. No diff = from zero.
          if [ -z "$BASE" ]; then
            cold=true; echo "from zero: yes — ${{ github.event_name }}, no diff (the net)"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then cp selection.json diff.json
            else node scripts/ci/select-specs.mjs --base "$BASE" --head HEAD --out diff.json | grep -E '^(diff|  [A-Z] |growth test)'; fi
            cold=$(jq -r .growth.run diff.json)
            echo "from zero (a PR: allowed; main: the net runs): $cold — $(jq -r '.growth.why | join("; ")' diff.json)"
          fi
          echo "cold=$cold" >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # 1. The fast gate: the whole chain + all four proofs, on real PostgreSQL, no Docker.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  #
  # ── THREE PARALLEL LEGS (2026-10-15) ────────────────────────────────────────────────────────────
  # With the prefix cache the apply is seconds; the job is the proofs, run one after another on one
  # wasm Postgres. Measured on run 38689706526: 12_merchant_companies 11m10s, 02_ledger_reconciliation
  # 4m30s, 05_first_voyage_balance 2m48s, the other nine together ~35s. Each proof already runs in
  # its own rolled-back, digest-checked transaction, so nothing couples them but the queue. The two
  # slow ones each get a leg by name; the third leg runs `--exclude=` those two names, so a proof
  # added tomorrow lands in it BY CONSTRUCTION and nothing can fall between legs. Every leg builds
  # the same world through the same prefix cache, enforces the same receipts floor and world guard,
  # and fails on its own markers — a leg that matched no proof fails as vacuous (proof.mjs).
  pglite-gate:
    name: pglite-gate (${{ matrix.leg }})
    needs: select
    # Skipped, as a whole, on a pull request that touches no database path (select's `db`).
    if: needs.select.outputs.db != 'false'
    env:
      RUN: ${{ fromJSON(needs.select.outputs.legs)[matrix.leg] }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: merchants
            args: 12_merchant_companies
          - leg: ledger
            args: 02_ledger_reconciliation
          - leg: the rest
            args: --exclude=12_merchant_companies,02_ledger_reconciliation
    runs-on: ubuntu-latest
    # 2026-08-31: RAISED 15 -> 30, and it is CAPACITY, not a slack limit. The chain takes ~13
    # minutes on wasm Postgres and grows with the world; PR #3 was CANCELLED at 15m14s with no
    # assertion failure at all -- the last receipt was 0056 and then nothing -- while
    # disposable-chain (real Postgres 17) passed the SAME commit in 5m45s. A cancelled job reads
    # exactly like a red one in the checks list, which is how a gate stops meaning anything.
    # 30 matches disposable-chain's own limit below. If this is hit again the answer is a lighter
    # fixture or a faster gate, NOT a bigger number -- the same ruling db.chain's 360 s spec
    # carries. READ THE LOG before ever calling this job's red a defect.
    #
    # IT WAS HIT ON 2026-10-11 (passed at 22m48s, CANCELLED at 30m16s on a commit that touched no
    # SQL) when the world tripled -- 26 -> 70 merchant companies, 35 -> 107 fleets. The ruling held:
    # the number stayed at 30 and proof 12's soak got lighter instead. It now drives the twenty-one
    # fleets npc_fleet_max lets sail rather than all seventy-six, which proves the same thing and
    # costs the same whatever the roster does next. The number was raised to 45 for about an hour in
    # between, on the belief that the lighter fixture had found a game defect; it had found a bug in
    # the filter I wrote for it (scripts/db/proofs/12_merchant_companies.sql says which), and when
    # that was fixed the budget came back here where the ruling put it.
    #
    # ── 2026-10-11, LATER THE SAME DAY: 30 -> 60, AND THE RULING ABOVE DID NOT APPLY ──────────────
    # Hit again on PR #94, CANCELLED at 30m14s. The ruling above says the answer is a lighter
    # fixture or a faster gate and NOT a bigger number, and that ruling was obeyed the last two
    # times. It could not be obeyed this time, and the reason is worth writing down rather than
    # leaving the next reader to assume somebody got lazy:
    #
    #   * THE COST IS NOT IN A FIXTURE. Last time it was proof 12's soak, which was lightened to the
    #     fleets npc_fleet_max lets sail and still proves the same thing. Proof 12 is ALREADY capped
    #     at 21 fleets (12_merchant_companies.sql:136) and is not what overran.
    #   * THE COST IS THE CHAIN'S OWN SELF-ASSERTS. 0105 founded 761 merchant companies over 219
    #     loops, so every assertion that walks routes went from 77 routes and 230 calls to 838 and
    #     3,302. Measured on a quiet machine: 0105 50 s, 0106 465 s, 0108/0109/0110 ~145 s each —
    #     some 16 minutes of self-assert on top of the ~13 the chain already took on wasm.
    #   * THOSE MIGRATIONS ARE APPLIED TO PRODUCTION. Editing a self-assert now would make the file
    #     in this repo stop describing what actually ran on the server, which is what forward-only
    #     exists to prevent. So the one remedy the ruling names was unavailable.
    #   * A FASTER GATE IS REAL WORK, NOT A TOGGLE. scripts/db/proof.mjs builds its world by calling
    #     applyChain() and has no connection-string path, so it cannot be pointed at the real
    #     Postgres that disposable-chain already stands up in 16m44s with budget to spare. THAT is
    #     the right fix — the proofs test game rules, not engine quirks, and running them on
    #     Postgres 17 would be strictly better than wasm — and it is logged as owner row 124 rather
    #     than done badly in a hurry here.
    #
    # 60 AND NOT 45. 45 was tried once before and reverted; more to the point the arithmetic says it
    # is too tight — 22m48s was the last passing run before 0105, plus ~16 minutes of new
    # self-assert is ~39, and a budget that fails at 41 buys another cancelled job that reads like a
    # red one. Generous and passing beats tight and ambiguous. When row 124 lands this comes back
    # down, and the ruling above stands for every case where a fixture CAN be lightened.
    #
    # 90 -> 150 on 2026-10-12, AND THIS IS THE THIRD RAISE, WHICH IS THE POINT. The run at 90
    # (38248046318) split like this:
    #
    #   the chain apply   12:17:07 -> 13:04:09   47m02s, all 103 receipts printed
    #   the proofs        13:04:09 -> 13:47:10   43m and STILL RUNNING when the cap fell
    #
    # So the job needs some hundred minutes of real work, the apply alone has grown from 31m56s to
    # 47m with one migration added, and every raise so far has been a budget set to roughly its own
    # cost. 150 is the measurement with genuine room — and it buys TIME, not a fix.
    #
    # WHAT THE FIX IS, SAID PLAINLY: those 47 minutes re-apply a chain `disposable-chain` has
    # ALREADY applied, green, on the same commit, against a real Postgres, in 33m49s — and then
    # left idle. This job's unique value is `npm run db:proof`, not the apply underneath it. Row 124
    # (give scripts/db/proof.mjs a path that does not call applyChain) deletes the 47 minutes
    # instead of budgeting for them, and row 127 records that it has stopped being a nuisance and
    # become the thing standing between a green branch and a merge. It is not done here because
    # doing it in a hurry, inside a workflow edit, is how a proof regime gets weakened by accident.
    #
    # The previous note, kept because its measurement is still the evidence:
    # 60 -> 90 on 2026-10-12, AND THE ARITHMETIC ABOVE WAS WRONG BY HALF. It added 0105's ~16
    # minutes to the last passing run and stopped there; what run 38148284551 actually measured,
    # cancelled at 1h00m16s, is two costs and not one:
    #
    #   the chain apply   14:43:05 -> 15:15:01   31m56s, all 102 receipts printed
    #   the proofs        15:15:01 -> 15:43:09   28m and STILL RUNNING when the cap fell
    #
    # So the job needs some 60 minutes of real work before anything is even allowed to be slow, and
    # 60 was a budget set to almost exactly its own cost — which is why it read as a failure rather
    # than as a timeout. 90 is that measurement plus room. Raising it a third time is NOT the fix
    # and is not pretended to be: the 32 minutes is one apply of a chain that `disposable-chain` has
    # ALREADY applied, green, on the same commit, in 33m51s, and then left idle. Row 124 is the one
    # that deletes this cost instead of budgeting for it, and row 127 records that it has stopped
    # being a nuisance and become the thing standing between a green branch and a merge.
    timeout-minutes: 150
    steps:
      - name: Does this run need this leg?
        run: |
          if [ "$RUN" = "true" ]; then echo "yes — see the select job's log for why"
          else echo "no added migration names what this leg's proof names, and no gate machinery changed: this leg is not run on this PR (main runs it)"; fi

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: 24  # 0039: Node scripts import src/lib/sea/*.ts via type stripping (default from 23.6)
          cache: npm

      - name: Install dependencies (from the lockfile)
        if: env.RUN == 'true'
        run: npm ci

      # ROW 124 (2026-10-13): THE PROOFS NO LONGER WAIT FOR A SECOND FROM-ZERO APPLY. proof.mjs
      # builds its world through the PREFIX CACHE (scripts/db/prefix-cache.mjs): the longest
      # already-applied prefix of THIS chain over THIS preamble is restored from a snapshot and only
      # the files after it are applied — every one of their self-asserts runs here, and the
      # restored files' receipts travel in the snapshot's manifest from the run that applied them,
      # so the every-migration-prints-a-receipt floor still judges the whole chain.
      #
      # A snapshot is refused unless its rolling key (preamble text + every file's name and
      # normalised SQL, in order), its file list, its tarball's sha-256 AND the content digest of
      # the database it restores to all match; proof.mjs then checks the composed file list against
      # supabase/migrations/ itself before any proof runs. The FROM-ZERO net is
      # job 2 below: disposable-chain applies every file from nothing, on a real Postgres, on every push
      # to main (a PR applies its new files on main's snapshot) — which is why this job never needed to do it a second time.
      #
      # Restore and save are split so a red proof still keeps the snapshots the apply paid for.
      - name: Restore the chain-prefix snapshots (keyed by the chain and the preamble)
        if: env.RUN == 'true'
        id: prefix
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/byeharu-chain-prefix
          key: chain-prefix-${{ hashFiles('supabase/migrations/*.sql', 'scripts/db/supabase-preamble.sql') }}
          restore-keys: chain-prefix-

      # A duplicate 14-digit version deploys as a SILENT no-op: schema_migrations keys on the
      # version, so the second file is recorded already-applied and skipped, with everything green.
      # It happened four times in the predecessor project. This check carries its own positive
      # control — it proves it can detect a deliberately duplicated version before reporting none.
      - name: Migration versions are unique
        if: env.RUN == 'true'
        run: npm run db:check-versions

      # ONE APPLY, NOT TWO (2026-09-27). This job used to run `npm run db:apply` and then
      # `npm run db:proof` — but proof.mjs applies the whole chain itself (a fresh PGlite), runs
      # the same world guard, and now enforces the same every-migration-prints-its-receipt floor.
      # The separate apply step was the chain applied TWICE, ~7 minutes of pure duplication, and
      # on the 0086-0091 deploy branch (84 files, 238 harbours, 555 goods) it pushed the job past
      # its 30-minute ceiling while every receipt and every marker it had reached was green —
      # cancelled during proof 05 with no assertion failure. Per the ruling above: a faster gate,
      # not a bigger number. Nothing is checked less: the apply, the receipts floor and the world
      # guard all run inside the step below, and a failure in any of them fails it.
      #
      # Every migration applies in order AND prints its own self-assert receipt; then offline
      # equivalence · ledger reconciliation · grant lockdown · the K.1 first session, and the rest.
      # Fails if any migration printed no receipt, if any declared PASS marker is missing, if a
      # proof declares none, or if a proof leaves committed rows behind.
      # THE LAW (docs/CI.md): on a PR the world comes from a cached prefix or this step FAILS with
      # the reason (prefix-cache.mjs, BYEHARU_PREFIX_CACHE=required) — never a from-zero apply.
      # Main is exempt (its run fills the cache), as is a PR that changed the chain machinery.
      # No wait is needed here, unlike disposable-chain: one chain-prefix entry holds the last FOUR
      # prefix lengths (plus one every 32), so the previous main entry still fits a chain that
      # grew by up to three files, out of order or not, and main saves its entry minutes after a merge.
      - name: Build the chain's world on PGlite (cached prefix + the files after it), then run every proof
        if: env.RUN == 'true'
        env:
          BYEHARU_PREFIX_CACHE: ${{ github.event_name == 'pull_request' && needs.select.outputs.cold != 'true' && 'required' || '' }}
        run: npm run db:proof -- ${{ matrix.args }}

      # One leg saves (all three built the same snapshots from the same chain); the others would
      # only race it for the same key.
      - name: Save the chain-prefix snapshots (even when a proof failed)
        if: always() && env.RUN == 'true' && matrix.leg == 'the rest' && steps.prefix.outputs.cache-hit != 'true' && hashFiles('node_modules/.cache/byeharu-chain-prefix/**') != ''
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/byeharu-chain-prefix
          key: chain-prefix-${{ hashFiles('supabase/migrations/*.sql', 'scripts/db/supabase-preamble.sql') }}

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # 2. The net: the same chain against Supabase's own roles and default privileges.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  disposable-chain:
    needs: select
    # Skipped, as a whole, on a pull request that touches no database path (select's `db`), and
    # GitHub counts that skip as the required check passing. `!cancelled()` is deliberate: this is
    # the REQUIRED check, so a `select` job that failed must not skip it (a job skipped through an
    # implied `success()` would count as passing too) — with no output from select the condition
    # holds and the chain is applied as before.
    if: ${{ !cancelled() && needs.select.outputs.db != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # list the repository's caches and main's runs (supabase-snapshot.sh choose)
    # 60 -> 120 on 2026-10-17, FOR THE WAIT, not for the apply: a PR may now wait up to 50 minutes
    # for main's run on its base (SNAPSHOT_WAIT_SECONDS), and the exempt case (chain machinery
    # changed, main's run red) may then still apply from zero, measured at 47-51 minutes. 50 + 51
    # + the restore path is ~105; 120 is that plus room. A non-exempt PR never reaches the apply:
    # it fails the "law" step below in seconds once the wait is over.
    #
    # 2026-10-11: 30 -> 60, and NOT because this job grew. It passed at 16m44s on the first push of
    # PR #94 and was CANCELLED at 30m26s on the second, inside the same step ("Start disposable local
    # Supabase"), on a commit whose only changes were a workflow comment and a doc row. That is a
    # two-fold swing in how long a shared GitHub runner takes to stand up Docker, initialise Postgres
    # and apply 102 migrations — and it means 30 minutes had stopped being a limit and become a coin
    # toss, which is worse than either outcome.
    #
    # WHAT ACTUALLY CHANGED IS THE CHAIN, and it is permanent: 0105 founded 761 merchant companies,
    # so every route-walking self-assert in 0105-0110 went from 77 routes and 230 calls to 838 and
    # 3,302, adding ~16 minutes to EVERY fresh apply anywhere — this gate, pglite-gate, a developer's
    # db:apply, and the production push. Those migrations are applied to production, so forward-only
    # forbids making their asserts cheaper after the fact; the cost is baked in and the budgets have
    # to carry it.
    #
    # Both budgets in this file are therefore 60, and both are stopgaps. Owner row 124 is the fix
    # that earns them back: give scripts/db/proof.mjs a connection-string path so the proofs run on
    # THIS job's real Postgres 17 instead of a second apply on wasm — one chain apply in CI instead
    # of two, and the proofs run on the engine production actually uses.
    timeout-minutes: 120
    env:
      # 'true' = this run applies the WHOLE chain from zero ON PURPOSE — the net: the nightly
      # schedule, a dispatch, or a push to main whose diff changed the chain machinery or an old
      # migration (select's `cold`). Everything else builds on a kept snapshot: a PR by the law, a
      # push to main because that is what makes the snapshots and the owner's rule is "CI never
      # starts from scratch". A `select` that failed leaves `cold` empty, so a push then takes the
      # snapshot path and, with nothing usable, falls through to a from-zero apply that is SAID.
      FROM_ZERO: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && needs.select.outputs.cold == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # the merge commit's first parent = the base whose snapshot a PR wants

      - name: Count the migrations about to be applied
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          echo "migrations found: ${#files[@]}"
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error title=Empty chain::No migrations. A green run over nothing is not a proof."
            exit 1
          fi
          printf '  %s\n' "${files[@]}"

      - uses: supabase/setup-cli@v1
        with:
          # PINNED, not "latest". Resolving "latest" costs a GitHub API call, and on 2026-08-18 that
          # call failed the whole job with "Failed to resolve latest Supabase CLI release: rate limit
          # exceeded" — an infrastructure flake reported as a red migration proof, which is the worst
          # kind of false signal to leave in place. A pinned version cannot be rate-limited, and it
          # also means the chain is proven against a known CLI rather than a moving one.
          version: 2.114.0

      # ── THE APPLIED-CHAIN SNAPSHOT (2026-10-15, scripts/ci/supabase-snapshot.sh) ─────────────
      # FROM ZERO (FROM_ZERO above: the nightly, a dispatch, a push that changed the chain
      # machinery): the WHOLE chain from 0001 on a fresh volume. That is the net, and afterwards
      # the stopped volume is kept as a snapshot.
      # ON A SNAPSHOT (a PR since 2026-10-17, the law; a push to main since 2026-10-18): `choose`
      # computes the key every usable snapshot would carry (the key IS the manifest's hash, one per
      # prefix length of this chain), on a PR waits — bounded — for main's run on the base commit
      # when it is still going and the base chain's own snapshot is not kept yet (a push does not
      # wait: SNAPSHOT_WAIT_SECONDS=0 — the heavy files are in every kept prefix, and applying a
      # few more merged files beats waiting on a sibling run), then names the LONGEST kept prefix
      # this run may restore. It is restored by EXACT key (no restore-keys, no "newest"); `usable`
      # then judges the restored bytes: the manifest (every file's name and sha-256, in order,
      # plus the CLI version and config.toml) must be an exact PREFIX of this chain. The CLI boots
      # it ("Starting database from backup...", no migrate step) and `supabase migration up`
      # applies the files after it — every new migration's self-asserts and CHECK constraints run
      # here exactly as before. NOTHING USABLE: a PR FAILS (the law step), unless it changed the
      # chain machinery; a push to main applies from zero and SAYS so (main is never refused — it
      # is the run that makes the snapshots). Every check below then runs against the result
      # unchanged, plus: what the database recorded equals supabase/migrations/, file for file.
      - name: Which kept snapshot is the longest prefix of THIS chain (a PR waits for main's run on its base)
        id: choose
        if: env.FROM_ZERO != 'true'
        env:
          SUPABASE_CLI_VERSION: 2.114.0
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_WAIT_SECONDS: ${{ github.event_name == 'push' && '0' || '3000' }}
        run: |
          set -euo pipefail
          bash scripts/ci/supabase-snapshot.sh choose "$(git rev-parse HEAD^1)" | tee -a "$GITHUB_OUTPUT"

      - name: Restore that applied-chain snapshot, by its exact key
        id: snap
        if: env.FROM_ZERO != 'true' && steps.choose.outputs.key != ''
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sbsnap
          key: ${{ steps.choose.outputs.key }}

      - name: Is the snapshot a prefix of THIS chain?
        id: plan
        env:
          SUPABASE_CLI_VERSION: 2.114.0
        run: |
          set -euo pipefail
          if [ "$FROM_ZERO" = "true" ]; then
            echo "${{ github.event_name }}, cold=${{ needs.select.outputs.cold }}: the full from-zero apply, on purpose (the net)"
            echo "usable=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          bash scripts/ci/supabase-snapshot.sh usable "$RUNNER_TEMP/sbsnap" | tee -a "$GITHUB_OUTPUT"

      # Main is never refused, but a from-zero apply there that nobody asked for is said out loud.
      - name: Main with nothing to build on — applying from zero, said
        if: github.event_name == 'push' && env.FROM_ZERO != 'true' && steps.plan.outputs.usable != 'true'
        run: echo "::warning title=From-zero apply on main::no kept snapshot is a prefix of this chain (the choose step says which were considered) — main is the run that makes the snapshots, so it applies from zero and keeps the result"

      # THE LAW: a pull request never applies the chain from zero. Exempt only when the diff
      # changed the chain machinery or an old migration (`select`'s `cold`), and then it is said.
      - name: The law — no from-zero apply on a pull request
        if: github.event_name == 'pull_request' && steps.plan.outputs.usable != 'true'
        env:
          COLD: ${{ needs.select.outputs.cold }}
        run: |
          set -euo pipefail
          if [ "$COLD" = "true" ]; then
            echo "::warning title=From-zero apply on a PR::no usable applied-chain snapshot, and this PR changed the chain machinery or an old migration (see the select job's log) — the law's one exemption: applying from zero"
            exit 0
          fi
          echo "::error title=No usable applied-chain snapshot::no usable applied-chain snapshot for this chain — refusing to rebuild from zero on a PR; re-run after main's migrations-apply-proof finishes (the choose step above says which snapshots were considered and why main's was waited for or not)"
          exit 1

      - name: Restore the snapshot into the db volume
        if: steps.plan.outputs.usable == 'true'
        env:
          SUPABASE_CLI_VERSION: 2.114.0
        run: bash scripts/ci/supabase-snapshot.sh restore "$RUNNER_TEMP/sbsnap"

      - name: Start disposable local Supabase (a restored volume boots from the snapshot; a fresh one applies the WHOLE chain, in order)
        run: supabase start

      - name: Apply the files after the snapshot (supabase migration up)
        if: steps.plan.outputs.usable == 'true'
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/sbenv0
          set -a; . /tmp/sbenv0; set +a
          # POSITIVE CONTROL: the booted database holds EXACTLY the snapshot's files and nothing was
          # re-applied or skipped on the way up.
          have="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc 'select count(*) from supabase_migrations.schema_migrations')"
          echo "restored database records $have applied migration(s); the snapshot covers ${{ steps.plan.outputs.prefix }}"
          if [ "$have" != "${{ steps.plan.outputs.prefix }}" ]; then
            echo "::error title=Snapshot mismatch::the restored database records $have migrations, its manifest ${{ steps.plan.outputs.prefix }}"; exit 1
          fi
          supabase migration up --local

      - name: Show what the database recorded as applied
        run: |
          set -euo pipefail
          supabase status -o env | tee /tmp/sbenv >/dev/null
          set -a; . /tmp/sbenv; set +a
          # Read back what actually landed — the applied list comes from the database, not from
          # the directory listing, so a silently-skipped duplicate version shows up as a gap here.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
            "select version, name from supabase_migrations.schema_migrations order by version;"
          # AND IT IS EXACTLY THE DIRECTORY (2026-10-15): every file's version recorded, nothing
          # more — whichever way (fresh or snapshot + migration up) the database got here.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc \
            "select version from supabase_migrations.schema_migrations order by version;" > /tmp/recorded.txt
          ls supabase/migrations/*.sql | xargs -n1 basename | cut -d_ -f1 | sort > /tmp/ondisk.txt
          if ! diff /tmp/ondisk.txt /tmp/recorded.txt; then
            echo "::error title=Chain mismatch::the database's applied list is not supabase/migrations/ (diff above: < on disk, > recorded)"; exit 1
          fi
          echo "OK: $(wc -l < /tmp/ondisk.txt) migration(s) on disk, the same $(wc -l < /tmp/recorded.txt) recorded."

      # THE DEFAULT ACLs, checked from OUTSIDE migration 0001, against the platform's own roles.
      #
      # Two different claims, because they have two different truth values on Supabase:
      #   1. Default ACLs owned by THE MIGRATION ROLE must be zero. Those govern every object the
      #      chain creates, so this one is enforced.
      #   2. Default ACLs owned by anyone else (Supabase's `supabase_admin` ships 16) CANNOT be
      #      revoked from the migration role — proven here on 2026-08-18, run 32122434872 — and do
      #      not need to be: a pg_default_acl row binds only objects created by its own grantor.
      #      They are PRINTED, never enforced, so a change in what the platform ships is visible on
      #      every run instead of being discovered by a failed deploy.
      # The claim that makes (2) safe — that nothing here was created by another grantor — is
      # enforced below, and again by proof 03's GRANT_LOCKDOWN_CHAIN_OWNS_EVERYTHING marker.
      - name: Default privileges and object ownership, after the chain
        run: |
          set -euo pipefail
          set -a; . /tmp/sbenv; set +a
          echo "── every default ACL in the database, after the whole chain ──"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c             "select pg_get_userbyid(d.defaclrole) as grantor,
                    coalesce(n.nspname,'(no schema)') as schema,
                    d.defaclobjtype as objtype,
                    d.defaclacl::text as acl
               from pg_default_acl d
               left join pg_namespace n on n.oid = d.defaclnamespace
              order by 1,2,3;"

          echo "── 1. default ACLs owned by the migration role (must be 0) ──"
          own="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc             "select count(*)
               from pg_default_acl d
               join pg_namespace n on n.oid = d.defaclnamespace
              cross join lateral aclexplode(d.defaclacl) a
              where n.nspname in ('public','world','cmd','voyage')
                and d.defaclrole = current_user::regrole::oid
                and (case when a.grantee = 0 then 'PUBLIC' else pg_get_userbyid(a.grantee) end)
                    in ('anon','authenticated','PUBLIC')
                and a.privilege_type in ('INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER','EXECUTE');")"
          echo "owned by $(psql "$DB_URL" -tAc 'select current_user'): $own"
          if [ "$own" != "0" ]; then
            echo "::error title=Default ACL leak::$own entr(ies) owned by the migration role would grant a client a write on every object it creates"
            exit 1
          fi

          echo "── 2. default ACLs owned by other grantors (reported, not enforced — see the comment above) ──"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c             "select pg_get_userbyid(d.defaclrole) as grantor, n.nspname as schema, d.defaclobjtype as objtype,
                    count(*) as client_write_or_execute_entries
               from pg_default_acl d
               join pg_namespace n on n.oid = d.defaclnamespace
              cross join lateral aclexplode(d.defaclacl) a
              where n.nspname in ('public','world','cmd','voyage')
                and d.defaclrole <> current_user::regrole::oid
                and (case when a.grantee = 0 then 'PUBLIC' else pg_get_userbyid(a.grantee) end)
                    in ('anon','authenticated','PUBLIC')
                and a.privilege_type in ('INSERT','UPDATE','DELETE','TRUNCATE','REFERENCES','TRIGGER','EXECUTE')
              group by 1,2,3 order by 1,2,3;"

          echo "── 3. THE CLAIM THAT MAKES (2) HARMLESS: every object here is owned by the migration role ──"
          # Deliberately a raw catalogue query, not the chain's own objects_not_owned_by(): an
          # independent second opinion on the claim proof 03 makes with the chain's authority.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c             "select n.nspname, c.relname, c.relkind, pg_get_userbyid(c.relowner) as owner
               from pg_class c join pg_namespace n on n.oid = c.relnamespace
              where n.nspname in ('public','world','cmd','voyage')
                and c.relkind in ('r','p','S','v','m','f')
                and c.relowner <> current_user::regrole::oid
                and not exists (select 1 from pg_depend dep
                                 where dep.classid = 'pg_class'::regclass and dep.objid = c.oid and dep.deptype = 'e')
              order by 1,2;"
          foreign_owned="$(psql "$DB_URL" -v ON_ERROR_STOP=1 -tAc             "select (select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace
                      where n.nspname in ('public','world','cmd','voyage') and c.relkind in ('r','p','S','v','m','f')
                        and c.relowner <> current_user::regrole::oid
                        and not exists (select 1 from pg_depend dep where dep.classid='pg_class'::regclass and dep.objid=c.oid and dep.deptype='e'))
                 + (select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                      where n.nspname in ('public','world','cmd','voyage')
                        and p.proowner <> current_user::regrole::oid
                        and not exists (select 1 from pg_depend dep where dep.classid='pg_proc'::regclass and dep.objid=p.oid and dep.deptype='e'));")"
          echo "objects (excluding extension members) not owned by the migration role: $foreign_owned"
          if [ "$foreign_owned" != "0" ]; then
            echo "::error title=Foreign-owned object::$foreign_owned object(s) were created by another role and may carry its default GRANTs"
            exit 1
          fi

      # THE REASON THIS JOB EXISTS. Locally the roles and the default ACLs are a FIXTURE that a
      # human wrote (scripts/db/supabase-preamble.sql) from what this job reported. HERE they are
      # the real thing, arriving from the platform — the exact shape that left `anon` able to write
      # a table in the predecessor and aborted a production deploy. A fixture can drift from the
      # platform; this job cannot. It is still the only place the claim is tested against Supabase.
      - name: Grant lockdown, against Supabase's own roles
        run: |
          set -euo pipefail
          set -a; . /tmp/sbenv; set +a
          : "${DB_URL:?DB_URL (disposable stack) required}"
          out="$(psql "$DB_URL" -v ON_ERROR_STOP=1 \
                   -c 'begin' -f scripts/db/proofs/03_grant_lockdown.sql -c 'rollback' 2>&1)" || {
            echo "$out"; echo "::error title=Lockdown proof failed::psql exited non-zero"; exit 1;
          }
          echo "$out"
          # Green is not "exit 0" — it is "every named marker was printed".
          for marker in GRANT_LOCKDOWN_PROBE_PROVES_QUERY \
                        GRANT_LOCKDOWN_NO_WRITE_GRANTS \
                        GRANT_LOCKDOWN_ANON_DENIED \
                        GRANT_LOCKDOWN_AUTHENTICATED_DENIED \
                        GRANT_LOCKDOWN_SECRET_UNREADABLE \
                        GRANT_LOCKDOWN_RLS_ON_EVERY_TABLE \
                        GRANT_LOCKDOWN_SERVICE_ROLE_RETAINED \
                        GRANT_LOCKDOWN_CHAIN_OWNS_EVERYTHING; do
            echo "$out" | grep -q "PASS: $marker" \
              || { echo "::error title=Missing PASS marker::$marker"; exit 1; }
          done
          echo "All 8 lockdown PASS markers present against Supabase's own roles."

      # WHAT IS KEPT: a green run's applied chain, stopped WITH its volume, tarred with its
      # manifest, saved under its own chain's key. A red run never becomes one.
      #   * ON MAIN (push, schedule, dispatch) EVERY green run is kept (2026-10-18) — the one built
      #     on a snapshot as much as the from-zero one. "Save everything you checked": the volume
      #     holds exactly the restored prefix (a snapshot a green run made, judged file for file by
      #     `usable`) plus the merged files applied here by the CLI's own applier, self-asserts
      #     and all, and the positive controls above proved the recorded list is the directory.
      #     That is the snapshot the next PR and the next main run restore. The nightly from-zero
      #     run re-anchors the line once a day: its snapshot carries the same key as an
      #     incremental run of the same chain (the key is the manifest), so a PR cannot tell them
      #     apart and does not need to.
      #   * ON A PR only a from-zero (exempt) run is kept, as before; it is visible to that PR
      #     only, by GitHub's cache scoping, and lets its next push skip the old files too — and if
      #     that push edits one of its own migrations the manifest is no longer a prefix and
      #     `choose` looks for a shorter one.
      - name: Keep the applied chain as a snapshot (green; main always, a PR only from zero)
        id: keep
        if: success() && (github.event_name != 'pull_request' || steps.plan.outputs.usable != 'true')
        env:
          SUPABASE_CLI_VERSION: 2.114.0
        run: |
          set -euo pipefail
          supabase stop
          bash scripts/ci/supabase-snapshot.sh save "$RUNNER_TEMP/sbsnap"
          echo "key=$(bash scripts/ci/supabase-snapshot.sh key)" >> "$GITHUB_OUTPUT"

      - name: Save the snapshot
        if: success() && steps.keep.outputs.key != ''
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sbsnap
          key: ${{ steps.keep.outputs.key }}

      - name: Stop disposable stack (always)
        if: always()
        run: supabase stop --no-backup || true
