name: Deploy (GitHub Pages)

# WHAT THIS PROVES
#   That the commit on `main` compiles, lints, typechecks, and produces a bundle that GitHub Pages
#   can actually serve at https://<owner>.github.io/byeharu-voyage/ — and then it publishes it.
#
#   Concretely, in order:
#     1. `npm ci` — the lockfile installs.
#     2. `npm run lint` — ESLint over every .ts/.tsx.
#     3. `npm run db:check-versions` — see that step's own comment. The chain ships INSIDE this
#        bundle, so a duplicate version is a deploy-blocking defect here, not just a database one.
#     4. `npm run build` (= `tsc -b && vite build`) — typecheck AND bundle, together.
#     5. upload `dist` and deploy it.
#
#   Steps 2 and 4 are build.yml's gate, repeated deliberately. `needs:` cannot reach across
#   workflows, so the only way to make "lint or typecheck is red" mean "nothing deploys" is to run
#   them here too. A deploy that trusted another workflow's tick would be trusting a claim.
#
# WHAT IT DOES NOT PROVE
#   That the deployed page works. Nothing here opens a browser — acceptance.yml does that, against
#   a build produced the same way. A green check here means "it is published", not "it is playable".
#
# WHICH BACKEND THE DEPLOYED BUILD RUNS
#   CLOUD MODE, ALWAYS. This is a law, not a default (2026-08-23, the owner, for the second time):
#   *"this is a online game, a user info and game progress should always be kept"* and *"All game
#   must be logged in so that they are safe."*
#
#   THIS WORKFLOW USED TO PUBLISH THE LOCAL-PGLITE BUILD, and that is the defect this block now
#   exists to prevent. `src/lib/rpc/init.ts` picks the cloud backend only when `hasCloud` is true,
#   decided at BUILD time from `VITE_SUPABASE_URL` / `VITE_SUPABASE_ANON_KEY`. This file passed
#   neither, so every visitor to the published site got PostgreSQL 18 compiled to WebAssembly in
#   their own tab and a private save file in IndexedDB — no account, no server, and a house that
#   ends when the browser is cleared. The Profile screen said so honestly, in a sentence the owner
#   read and rightly called nonsense for an online game. The sentence was not the bug. This was.
#
#   THE MISSING SECRETS NOW FAIL THE DEPLOY. They do NOT fall back to local mode. A silent
#   fallback is how the wrong game got published for weeks while every check stayed green: the
#   local build compiles, lints, boots and plays, so nothing downstream can tell it is the wrong
#   artefact. The only place that difference is knowable is here, so this is where it must fail.
#   Local-PGlite mode remains what it was built to be — a DEVELOPMENT and TEST backend (`npm run
#   dev`, `--mode browser`, the whole proof harness). It is not a thing players are given.
#
# THE FIRST RUN NEEDS A HUMAN
#   Settings → Pages → "Build and deployment" → Source: **GitHub Actions**. Until that is switched
#   from "Deploy from a branch", `actions/deploy-pages` fails with "Not Found" / "Pages site not
#   configured". Nothing in this file can do it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and `cancel-in-progress: false` on purpose: cancelling a half-finished
# Pages deployment can leave the site on a partially uploaded artifact. Queue, do not interrupt.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # 1. Produce the artifact — and refuse to produce one from code that does not pass the gate.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (from the lockfile)
        run: npm ci

      - name: Lint
        run: npm run lint

      # In local mode the browser applies supabase/migrations/*.sql itself, and
      # src/lib/db/chain.ts:64 THROWS on a duplicate 14-digit version rather than booting a world
      # with a migration silently missing from it. So a duplicate version does not merely deploy
      # as a no-op here — it deploys a game that refuses to start. Same authority as the other two
      # workflows use, called rather than re-implemented.
      - name: Migration versions are unique
        run: npm run db:check-versions

      # THE GUARD THAT MAKES "CLOUD MODE, ALWAYS" TRUE rather than intended. It runs BEFORE the
      # build so the failure names the cause; a missing secret would otherwise surface as a
      # perfectly good local-mode bundle that nothing further down can distinguish from the right
      # one. Both values are required together: `hasCloud` is `Boolean(url && anonKey)`, so one
      # without the other is silently false and publishes the local build again.
      - name: The deployed build must be a CLOUD build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish. Missing repository secret(s):$missing"
            echo "Without both, src/lib/rpc/init.ts sets hasCloud=false and this job would publish"
            echo "the local-PGlite build: no account, no server, and a world that dies with the"
            echo "browser's storage. That is not what is shipped to players."
            echo "Fix: Settings -> Secrets and variables -> Actions -> New repository secret."
            exit 1
          fi
          echo "Both secrets present. Building in cloud mode."

      # `npm run build` is `tsc -b && vite build`: the typecheck gates the bundle, in one step.
      # The two VITE_SUPABASE_* values are what make `hasCloud` true, and they are read at BUILD
      # time — Vite substitutes them into the bundle, so they cannot be supplied at run time.
      - name: Build (tsc -b && vite build)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - uses: actions/configure-pages@v5

      # `dist` is what vite.config.ts writes, and its `base: '/byeharu-voyage/'` is what makes the
      # asset URLs and public/404.html's redirector agree with the project-site path. Do not
      # change one without the other.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # 2. Publish it. Separate job so the deploy cannot run unless the gate above went green.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
