name: Build (lint · typecheck · production build)

# WHAT THIS PROVES
#   That the app a reviewer is about to merge actually compiles and bundles, on a clean machine,
#   from the committed lockfile alone.
#
#   Concretely, in order:
#     1. `npm ci` — the lockfile installs. A dependency added by hand and never locked fails here.
#     2. `npm run lint` — ESLint over every .ts/.tsx.
#     3. duplicate migration versions — see the step's own comment; a duplicate version deploys as
#        a SILENT no-op, so it is caught here rather than in production.
#     4. `tsc -b` — the whole TypeScript project graph (app + node config + tests) typechecks.
#     5. `vite build` — the production bundle is really produced, Tailwind included.
#
# WHAT IT DOES NOT PROVE
#   Nothing about SQL, and nothing about how the app behaves in a browser. The migration chain is
#   proven only by migrations-apply-proof.yml, and runtime behaviour only by acceptance.yml, which
#   serves this same build and runs the whole spec suite — including the one browser spec — against
#   it. A green check HERE still means "it builds", not "it works"; the tick that means "it works"
#   is the other one.
#
#   Nor does it publish anything: deploy-pages.yml is what puts a build on GitHub Pages, and it
#   repeats this workflow's lint and typecheck rather than trusting this tick, because `needs:`
#   cannot reach across workflows.
#
#   Local npm on the dev machine is not the bar either — this workflow is the bar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # 25, not 10, since 2026-08-25: `vite build` now APPLIES THE WHOLE CHAIN once, to emit the
    # pre-built world image (vite.config.ts, `byeharu:world-image`). Measured on the dev machine
    # that is 76 s quiet and 216 s under load; a 2-core runner is slower than either, and it lands
    # on top of npm ci + lint + typecheck. At 10 minutes this job would have started failing on
    # wall-clock alone the first time the image shipped — a red that names nothing.
    #
    # 25 -> 60 on 2026-10-12, and the cause is a MEASUREMENT and not a guess: with a COLD world-image
    # cache the chain apply inside this build took **32m33s** on a 2-core runner (acceptance.yml,
    # run 38148284600, 14:48:16 to 15:20:49), because 0105's roster took every route-walking
    # self-assert from 77 routes/230 calls to 838/3,302. Production has run those migrations, so the
    # chain is forward-only and that cost is permanent. The cache below hides it on a HIT — this job
    # finished the same build in 33s on one — but a cache is not a guarantee: a cache entry is
    # scoped to its ref, so the first run on a NEW chain fingerprint, and every run on `main` after
    # a feature branch merges, misses by construction. The budget has to cover a miss, or the
    # publish fails on the one run that matters. 60 is the miss plus room, not a ceiling anybody
    # expects to approach.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # the merge commit's first parent, for the law's exemption check below

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # 0039: Node scripts import src/lib/sea/*.ts via type stripping (default from 23.6)
          cache: npm

      - name: Install dependencies (from the lockfile)
        run: npm ci

      # THE LAW (owner, 2026-10-17; docs/CI.md): a pull request's CI never builds a world from
      # zero. The one exemption is a PR that changed the chain machinery or an old migration, and
      # scripts/ci/select-specs.mjs decides that (its growth rule) — the same authority acceptance.yml
      # and migrations-apply-proof.yml read. On main the question does not arise: main may be cold.
      - name: May this run build the world from zero? (the law's one exemption)
        id: cold
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/select-specs.mjs --base HEAD^1 --head HEAD --out selection.json > selection.txt
            grep -E '^(diff|  [A-Z] )' selection.txt || true
            cold=$(jq -r .growth.run selection.json)
            if [ "$cold" = "true" ]; then echo "yes: $(jq -r '.growth.why | join("; ")' selection.json)"
            else echo "no: a pull request builds the world from a cached prefix or fails (BYEHARU_PREFIX_CACHE=required)"; fi
          else
            cold=true; echo "not a pull request: main may build from zero (its builds fill the cache)"
          fi
          echo "cold=$cold" >> "$GITHUB_OUTPUT"

      # The world image is keyed by the CHAIN, so a run whose migrations are unchanged can restore
      # the tarball instead of applying 47 migrations to build a world it already built. It must
      # come AFTER npm ci: npm ci removes node_modules whole, and the cache lives inside it.
      # A miss is not a failure on MAIN — the build applies the chain. On a PR a miss with no usable
      # prefix snapshot FAILS the build step (the law above), unless the exemption holds.
      #
      # `restore-keys` (2026-10-13): when the chain MOVED, the most recent older entry (this
      # branch's, else main's) is restored instead of nothing. It holds PREFIX SNAPSHOTS
      # (scripts/db/prefix-cache.mjs) — the world after files 1..k, keyed by a rolling key over
      # their normalised text — so the build restores the longest prefix the new chain shares and
      # applies only the files after it, every self-assert included. An older entry cannot serve a
      # wrong world: the image is still named and stamped `fingerprintChain(this chain)`, a snapshot
      # is refused unless its key, file list, tarball hash and restored content digest all match,
      # and the restored image is certified exactly as before.
      - name: Cache the pre-built world image (keyed by the chain)
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/byeharu-world-image
          key: world-image-${{ hashFiles('supabase/migrations/*.sql') }}
          restore-keys: world-image-

      - name: Lint
        run: npm run lint

      # A duplicate migration version deploys as a SILENT NO-OP: schema_migrations keys on the
      # version, so a second file carrying an existing version is recorded already-applied and
      # skipped, with everything green. It happened four times in the byeharu project and was
      # caught by hand every time. This guard lives in `build` deliberately: `build` is the check
      # that gates a merge, so it is the only place that can actually block one.
      # It is a no-op while supabase/migrations/ holds no .sql files.
      - name: Migration versions are unique
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations yet — nothing to check."
            exit 0
          fi
          dupes=$(printf '%s\n' "${files[@]}" \
            | xargs -n1 basename \
            | cut -d_ -f1 \
            | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "DUPLICATE migration version(s) — the later file would be silently skipped:"
            echo "$dupes"
            exit 1
          fi
          echo "OK: ${#files[@]} migration(s), all versions unique."

      - name: Typecheck (tsc -b)
        run: npx tsc -b

      - name: Production build (vite build)
        env:
          BYEHARU_PREFIX_CACHE: ${{ github.event_name == 'pull_request' && steps.cold.outputs.cold != 'true' && 'required' || '' }}
        run: npx vite build
