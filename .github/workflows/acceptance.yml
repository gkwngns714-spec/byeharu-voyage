name: Acceptance (the whole spec suite, against a served build)

# WHAT THIS PROVES
#   That the app RUNS. build.yml's own header says a green tick there means "it builds, not it
#   works"; this is the workflow that closes that sentence. It builds the app exactly as
#   deploy-pages.yml does, serves that build, and runs every spec in tests/ against it.
#
#   The suite is two different kinds of proof and this job runs both in one pass:
#
#     * TEN PURE SPECS (db.chain, format, map.*, rpc.*, sections, tableLayout) never ask for the
#       `page` fixture, so Playwright runs them as plain Node processes. Three of them boot PGlite
#       — real PostgreSQL 18 on wasm32 — and drive the real RPC surface over the real chain. They
#       need no browser at all; they are here because this is where the suite lives.
#
#     * ONE BROWSER SPEC, tests/layout.spec.ts, needs a real 390×844 viewport AND a served app.
#       Its header has said "NOT RUN IN CI ... there are no browser binaries in the runner" since
#       it was written. That is what this workflow changes, and that header should be updated when
#       this lands. It is the only proof that no data is hidden on a phone — the defect it caught
#       (a fleet-roster column sheared off the right edge while `scrollWidth === clientWidth`) is
#       invisible to lint, to tsc, to vite build, and to every pure spec above it.
#
#   NO SPEC IS EXCLUDED, and none needed to be. Every spec in tests/ is either pure Node or wants
#   exactly what this job provides — a chromium and a served build. The only reason the browser
#   spec was ever a local-only gate is that CI had neither.
#
# WHY IT IS ITS OWN WORKFLOW AND NOT A JOB IN build.yml
#   The repo partitions workflows by the CLAIM they make — build.yml says "it compiles",
#   migrations-apply-proof.yml says "the chain applies", and this one says "it runs". Folding a
#   browser job into build.yml would make its name and its whole header block false.
#
#   The practical half matters more. build.yml is the fast merge gate, budgeted at 10 minutes.
#   This job downloads a chromium and then waits while a 16-migration chain applies INSIDE that
#   browser, six times over — once per tab measured. Attaching that to the merge gate would turn a
#   three-minute signal into a twenty-minute one for every push, including the ones that fail lint
#   in the first thirty seconds. Kept separate, both signals arrive when they are useful.
#
# WHAT IT DOES NOT PROVE
#   Nothing about SQL against real Supabase (migrations-apply-proof.yml job 2 owns that), nothing
#   about the cloud backend (which has never made a round trip — HANDOFF §3a), and nothing about
#   RLS: under PGlite the migration role is a superuser, so local play proves the RULES, never the
#   WALLS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ── FOUR SHARDS AND ONE VERDICT (2026-10-13) ─────────────────────────────────────────────────────
# The suite ran on ONE runner: 52m22s of `Run the suite` inside a 62-minute job on main (run
# 38081084926), and 74m32s-and-cancelled on the merchant branch. Nothing in it was slow for a
# reason a budget could fix — it was 365-382 tests in one queue. So the suite is split by a
# MEASURED-TIME test list (scripts/ci/shard-plan.mjs) over four parallel runners (`acceptance-shard`), and ONE job named `acceptance`
# — the required check, so branch protection is unchanged — delivers the verdict.
#
# NO ASSERTION IS DROPPED AND THE NON-VACUITY FLOOR GOT STRICTER, not looser:
#   * every shard still fails on any failed test, any skip, or zero tests run — its own floor;
#   * the verdict job then requires all four shards' stats to have ARRIVED, every shard to have run
#     at least one test, zero skipped / unexpected / flaky across them, and — new — the SUM of
#     expected (passed) tests across the shards to EQUAL the number of tests `playwright test
#     --list` finds in tests/. A shard that silently ran nothing, or a split that lost a file,
#     can no longer read as green.
jobs:
  acceptance-shard:
    name: acceptance-shard (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The budget history below is kept because its measurements are still the evidence. With four
    # shards a shard carries roughly a quarter of the suite; 75 is left where it was until CI has
    # measured the split, and should come DOWN once it has (DEV_LOG 2026-10-13 records the numbers).
    #
    # Derived from the suite's own declared budgets, not from a stopwatch. The slow half is the
    # browser spec: six tests (five tabs plus the market fold), each of which loads the app and
    # waits while the 16-migration chain applies inside chromium. layout.spec.ts's `ready()`
    # allows 90 s for that, so those six alone can take ~9 min, and playwright.config.ts sets a
    # 120 s per-test cap. Add a chromium download, `npm ci`, a production build, and three pure
    # specs that each boot PGlite in Node. 25 leaves genuine headroom without letting a hung run
    # burn half an hour of runner time. If this number ever needs raising, find out WHY first —
    # a suite that got slower is usually a boot that got slower, and that is the player's boot.
    # 2026-08-31: RAISED 25 -> 40, and this is the THIRD gate today whose red was a clock rather
    # than a defect (pglite-gate 15 -> 30 was the other two). PR #3's run was cancelled at exactly
    # 25m15s -- no failing spec, no assertion, just the ceiling -- and a cancelled job is
    # indistinguishable from a failed one in the checks list.
    #
    # THE REAL ANSWER IS NOT A BIGGER NUMBER, and it is written here so the next person does not
    # have to rediscover it: the suite has no `workers` setting, so Playwright runs about half the
    # runner's CPUs, and MORE THAN ONE spec builds the whole 243-good world (db.chain's cold boot,
    # rpc.firstSession, the map fixtures). Two of those racing is why db.chain's cold boot took
    # 5.0 min in CI against 1.8 min locally, and it is the likeliest cause of the one-shot retry
    # that reddened it. Serialising the world-building specs -- or giving them one shared built
    # world -- removes both the contention and most of the wall clock. THAT is the fix; this is
    # headroom so the gate keeps meaning something until it is done.
    # RAISED 2026-09-02, 40 -> 75. Migration 0065 grew the catalogue from 243 goods to 523 and the
    # market from 54,432 rows to 117,152 - 2.15x - to make the owner's "no good in more than three
    # cities" rule possible at all. Two tests in db.chain.spec.ts build the whole world (one of
    # them twice) and now cost 6.9 and 12.2 minutes: nineteen of the old forty in two tests.
    #
    # The symptom that says this is a BUDGET and not a slowdown: the same chain passed on one
    # runner and died at 40m16s on another, minutes apart. A gate that decides by runner speed
    # gates nothing, which is the same defect those two tests' own timeouts were raised for twice
    # before. If this climbs again the answer is a lighter fixture for those two - they are the
    # only expensive tests here - and not a third raise.
    # 75 -> 120 on 2026-10-12. The build inside this job is no longer the cost — the world-image
    # cache took it from 32m33s to NINE SECONDS, measured on run 38248046334 — but the SUITE then
    # ran 74m32s and was cancelled still running. 378 tests, two workers, several of which boot a
    # PGlite world of their own. The npc-on cache above takes ~18 minutes out of that; 120 is the
    # remainder with room, rather than another budget set to its own cost, which is the mistake
    # this file made twice (see migrations-apply-proof.yml for the same lesson written longer).
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24  # 0039: Node scripts import src/lib/sea/*.ts via type stripping (default from 23.6)
          cache: npm

      - name: Install dependencies (from the lockfile)
        run: npm ci

      # THE SAME CACHE AND KEY as build.yml and deploy-pages.yml, which this workflow lacked: with
      # no cache every run paid a full chain apply inside `npm run build` (8m57s on main, run
      # 38081084926; 32m33s on the merchant branch). Restored AFTER npm ci, which removes
      # node_modules whole. `restore-keys` brings back the newest older entry when the chain moved,
      # and its prefix snapshots (scripts/db/prefix-cache.mjs) mean only the new files are applied.
      # Restore and save are split so a red suite still keeps the world it paid for.
      - name: Restore the pre-built world image (keyed by the chain)
        id: world
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/byeharu-world-image
          key: world-image-${{ hashFiles('supabase/migrations/*.sql') }}
          restore-keys: world-image-

      # chromium ONLY. The suite declares one project (playwright.config.ts) and one spec needs a
      # browser; firefox and webkit would be two more downloads proving nothing. `--with-deps`
      # pulls the shared libraries the runner image does not ship.
      # THE MERCHANTS-ON WORLD IS NOT KEPT BETWEEN RUNS (removed 2026-10-14). It was cached here
      # keyed on the chain and the fixture, but its merchants sail on `now()`: run 38485001228
      # restored a 14-hour-old copy and the page froze catching 837 fleets up. A run builds it
      # fresh (`tests/npcOn.fixture.ts`, which gives that build its own 30-minute allowance).

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      # The SAME build deploy-pages.yml publishes, produced the same way — no VITE_SUPABASE_URL and
      # no VITE_SUPABASE_ANON_KEY, so `hasCloud` is false and the app boots the local PGlite engine.
      # This is deliberate and load-bearing: a cloud build redirects every route to /auth, where
      # there is no world and no table, and layout.spec.ts would SKIP itself rather than measure.
      # The floor at the end of this job is what makes that impossible to miss.
      - name: Build the app under test (local-PGlite mode)
        run: npm run build

      # One shard saves (they all built the same image from the same chain); the others would only
      # race it for the same key.
      - name: Save the pre-built world image
        if: matrix.shard == 1 && steps.world.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/byeharu-world-image
          key: world-image-${{ hashFiles('supabase/migrations/*.sql') }}

      # `--strictPort` so a taken port fails here, loudly, instead of leaving the suite pointed at
      # nothing. The host and port must match playwright.config.ts's PLAYWRIGHT_BASE_URL default
      # (http://127.0.0.1:4173/byeharu-voyage/); that env var is left unset on purpose so the
      # config stays the single authority for the URL. If they ever disagree, every browser test
      # skips — which the no-skips floor below turns into a red run rather than a green one.
      - name: Serve the build
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4173/byeharu-voyage/ > /dev/null; then
              echo "served after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error title=Nothing served::vite preview never answered on 127.0.0.1:4173"
          cat /tmp/preview.log
          exit 1

      # Reporters are set on the CLI rather than in playwright.config.ts so the config keeps
      # describing how a developer runs the suite. `json` is here only to be read by the next steps.
      #
      # THE SPLIT IS BY MEASURED TIME (scripts/ci/shard-plan.mjs, tests/shard-weights.json), not
      # Playwright's `--shard`, which cuts equal COUNTS: the first run with `--shard=i/4` took
      # 29.8m / 32s / 1.9m / 20.0m because db.chain.spec.ts's four from-zero world builds all fell in
      # one chunk. The plan is built from `playwright test --list`, so a new spec is never left out.
      - name: Run this shard of the suite
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        run: |
          set -euo pipefail
          node scripts/ci/shard-plan.mjs ${{ matrix.shard }} 4 shard-tests.txt
          npx playwright test --test-list shard-tests.txt --reporter=list,html,json

      # THE NON-VACUITY FLOOR, PER SHARD. Green is not "playwright exited 0" — it is "the tests that
      # matter actually ran". Every skip in tests/ lives in layout.spec.ts and every one of them
      # fires on a condition this job exists to rule out: nothing served, or a cloud build sitting
      # on /auth. Either would produce a perfectly green run that measured no pixels at all, which
      # is the exact camouflage that spec was written to strip off. So a skip here is a failure.
      - name: Every test in this shard ran — no skips, and not zero tests
        if: always()
        run: |
          set -euo pipefail
          test -f playwright-results.json || {
            echo "::error title=No JSON report::shard ${{ matrix.shard }} did not run to completion"; exit 1; }
          expected=$(jq -r '.stats.expected // 0' playwright-results.json)
          skipped=$(jq -r '.stats.skipped  // 0' playwright-results.json)
          echo "shard ${{ matrix.shard }}/4 — expected: $expected   skipped: $skipped"
          if [ "$expected" -eq 0 ]; then
            echo "::error title=Vacuous shard::0 tests passed in shard ${{ matrix.shard }}. A green tick over nothing is not a proof."
            exit 1
          fi
          if [ "$skipped" -ne 0 ]; then
            echo "::error title=Skipped test(s)::$skipped test(s) skipped. Every skip in tests/ means the app was not served, or was built in cloud mode — neither is a pass."
            # Walk the whole tree: the JSON reporter nests a file suite inside a project suite, so
            # a fixed `.suites[].specs[]` path silently finds nothing. `.stats` is the authority
            # that failed the step; this is only here to name the tests.
            jq -r '[.. | objects | select(has("tests") and has("title"))]
                   | .[] | select(any(.tests[]?; .status == "skipped"))
                   | "  skipped: \(.title)"' playwright-results.json || true
            exit 1
          fi
          echo "OK: $expected test(s) ran in shard ${{ matrix.shard }}, none skipped."

      # The shard's COUNTS only — a few hundred bytes — for the verdict job. Never the report: a
      # report on every run is what hit the artifact quota on 2026-08-22 (see below).
      - name: Hand this shard's counts to the verdict
        if: always()
        run: |
          set -euo pipefail
          mkdir -p shard-stats
          if [ -f playwright-results.json ]; then
            jq '{shard: ${{ matrix.shard }}, stats: .stats}' playwright-results.json > shard-stats/shard-${{ matrix.shard }}.json
          else
            echo '{"shard": ${{ matrix.shard }}, "stats": null}' > shard-stats/shard-${{ matrix.shard }}.json
          fi
          cat shard-stats/shard-${{ matrix.shard }}.json

      - name: Upload this shard's counts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-stats-${{ matrix.shard }}
          path: shard-stats/
          retention-days: 1

      # `screenshot: on` and `trace: on` are the config's defaults, so a red run arrives with the
      # picture and the timeline already in it.
      #
      # ── ONLY ON FAILURE, AND NEVER ALLOWED TO FAIL THE JOB (2026-08-22) ────────────────────────
      # This step used to run `if: always()` with a 14-day retention, and on its very first real
      # push it turned a GREEN suite RED:
      #
      #     157 passed (11.3m) · expected: 157  skipped: 0 · OK: 157 test(s) ran, none skipped.
      #     ##[error]Failed to CreateArtifact: Artifact storage quota has been hit.
      #
      # 183 files per run, every run, on a private repo's storage allowance. The reason given for
      # `always()` was that "a green report is how the phone-width measurements get read back" —
      # but a report nobody opens is not worth a red tick on a passing suite, and the measurements
      # that matter are asserted by the specs themselves rather than read out of an artifact.
      #
      # `if: failure()` keeps the trace exactly where it is useful. `continue-on-error` is the
      # load-bearing half: a STORAGE problem must never be able to mask a test result again, in
      # either direction. The suite's own step is what decides this job.
      - name: Upload the Playwright report (only when something failed)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright-results.json
          retention-days: 7

      - name: Stop the preview server (always)
        if: always()
        run: kill "${PREVIEW_PID:-0}" 2>/dev/null || true

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # THE VERDICT — named `acceptance`, the check branch protection requires.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  acceptance:
    name: acceptance
    needs: acceptance-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (from the lockfile)
        run: npm ci

      - name: Collect every shard's counts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-stats-*
          path: shard-stats
          merge-multiple: true

      - name: All four shards ran, and together they ran EVERY test in tests/
        env:
          SHARDS_RESULT: ${{ needs.acceptance-shard.result }}
        run: |
          set -euo pipefail
          ls -la shard-stats || true
          fail=0
          total_expected=0
          for i in 1 2 3 4; do
            f="shard-stats/shard-$i.json"
            if [ ! -f "$f" ]; then
              echo "::error title=Missing shard::shard $i/4 handed back no counts — it did not run to the end"; fail=1; continue
            fi
            if [ "$(jq -r '.stats == null' "$f")" = "true" ]; then
              echo "::error title=No JSON report::shard $i/4 produced no Playwright report"; fail=1; continue
            fi
            e=$(jq -r '.stats.expected // 0' "$f"); s=$(jq -r '.stats.skipped // 0' "$f")
            u=$(jq -r '.stats.unexpected // 0' "$f"); fl=$(jq -r '.stats.flaky // 0' "$f")
            echo "shard $i/4: expected=$e skipped=$s unexpected=$u flaky=$fl"
            [ "$e" -gt 0 ] || { echo "::error title=Vacuous shard::shard $i/4 passed 0 tests"; fail=1; }
            [ "$s" -eq 0 ] || { echo "::error title=Skipped test(s)::shard $i/4 skipped $s"; fail=1; }
            [ "$u" -eq 0 ] || { echo "::error title=Failed test(s)::shard $i/4 had $u unexpected result(s)"; fail=1; }
            [ "$fl" -eq 0 ] || { echo "::error title=Flaky test(s)::shard $i/4 had $fl flaky result(s)"; fail=1; }
            total_expected=$((total_expected + e))
          done
          # The denominator, from tests/ itself and not from the shards: a split that lost a file
          # would otherwise sum to a smaller, perfectly green number.
          listed=$(npx playwright test --list | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -1)
          echo "tests in tests/ (playwright test --list): ${listed:-?}   passed across the shards: $total_expected"
          if [ -z "$listed" ] || [ "$listed" -eq 0 ]; then
            echo "::error title=No denominator::playwright test --list found no tests"; fail=1
          elif [ "$total_expected" -ne "$listed" ]; then
            echo "::error title=Tests unaccounted for::$listed test(s) in tests/ but $total_expected passed across the four shards"; fail=1
          fi
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error title=Shard failed::the shard matrix finished '$SHARDS_RESULT'"; fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "OK: $total_expected of $listed test(s) passed across 4 shards, none skipped."

