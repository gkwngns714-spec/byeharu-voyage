name: Acceptance (the whole spec suite, against a served build)

# ══ ON A PULL REQUEST: ONLY THE SPECS THE DIFF CAN REACH (2026-10-17) ══════════════════════════════
# The owner's order: "make CI shorter — CI tests only from where we made something new, not the
# whole game". So a PR runs the specs its change can reach, and a push to main runs EVERY spec,
# exactly as before — main's run is the net that catches whatever a selection rule cannot see.
#
#   WHO DECIDES: scripts/ci/select-specs.mjs, in the `select` job, and nothing else. It diffs the
#   PR's merge commit against its FIRST PARENT and writes selection.json — the selected spec files,
#   each with the rule(s) that selected it, printed in that job's log and its step summary. Every
#   shard and the verdict read that one file. Its rules, in short (the script's header is the
#   authority, and docs/CI.md explains them):
#     F  full suite: playwright config, package(-lock).json, tsconfig, vite.config, index.html,
#        src/main.tsx, src/lib/db/**, the world-image pipeline in scripts/db, tests/appReady.fixture.ts,
#        or an EDITED (not added) migration
#     C  a changed spec;  G  a spec importing a changed file (transitively);  N  a spec naming a
#        changed file;  T  a directory-walking spec when its tree changed;  A  the app shell
#        (src/app, index.css, components/ui, public) → every browser spec;  I  a browser spec naming
#        a data-testid a changed src file declares;  L  a changed face → layout + wide.layout
#     S  an ADDED migration: the functions/tables it defines (and the names it mentions) → the specs
#        naming them, and through the RPC catalogue into the src that calls them; npc_* → the npc
#        pool; always db.chain + db.image
#   The script's own positive controls (real commits with known answers: docs-only → nothing,
#   0136 → the trade_routes/port_offers specs, #141 → its three map specs, appReady → full) run
#   first in `select`; a rule change that breaks one is red there.
#
#   THE SAME CHECK NAMES, ALWAYS: every job below still runs and reports. A shard whose share of
#   the selection is empty plans nothing, skips its build, logs "no affected specs in this pool"
#   and succeeds; the merchants-on world is built only when an npc-pool spec is selected.
#
#   THE VERDICT ON A PR requires passed == the number of tests `playwright test --list` finds in
#   the SELECTED files (minus a deferred growth test), zero skips, every shard reported, and a
#   shard that passed nothing to have PLANNED nothing. On main: passed == `--list` over all of
#   tests/, unchanged. Zero selected on a PR is green with the log saying so — nothing it changed is
#   reachable by a spec, and main's full run is where that claim is checked.
# ═════════════════════════════════════════════════════════════════════════════════════════════════

# WHAT THIS PROVES
#   That the app RUNS. build.yml's own header says a green tick there means "it builds, not it
#   works"; this is the workflow that closes that sentence. It builds the app exactly as
#   deploy-pages.yml does, serves that build, and runs every spec in tests/ against it.
#
#   The suite is two different kinds of proof and this job runs both in one pass:
#
#     * TEN PURE SPECS (db.chain, format, map.*, rpc.*, sections, tableLayout) never ask for the
#       `page` fixture, so Playwright runs them as plain Node processes. Three of them boot PGlite
#       — real PostgreSQL 18 on wasm32 — and drive the real RPC surface over the real chain. They
#       need no browser at all; they are here because this is where the suite lives.
#
#     * ONE BROWSER SPEC, tests/layout.spec.ts, needs a real 390×844 viewport AND a served app.
#       Its header has said "NOT RUN IN CI ... there are no browser binaries in the runner" since
#       it was written. That is what this workflow changes, and that header should be updated when
#       this lands. It is the only proof that no data is hidden on a phone — the defect it caught
#       (a fleet-roster column sheared off the right edge while `scrollWidth === clientWidth`) is
#       invisible to lint, to tsc, to vite build, and to every pure spec above it.
#
#   NO SPEC IS EXCLUDED, and none needed to be. Every spec in tests/ is either pure Node or wants
#   exactly what this job provides — a chromium and a served build. The only reason the browser
#   spec was ever a local-only gate is that CI had neither.
#
# WHY IT IS ITS OWN WORKFLOW AND NOT A JOB IN build.yml
#   The repo partitions workflows by the CLAIM they make — build.yml says "it compiles",
#   migrations-apply-proof.yml says "the chain applies", and this one says "it runs". Folding a
#   browser job into build.yml would make its name and its whole header block false.
#
#   The practical half matters more. build.yml is the fast merge gate, budgeted at 10 minutes.
#   This job downloads a chromium and then waits while a 16-migration chain applies INSIDE that
#   browser, six times over — once per tab measured. Attaching that to the merge gate would turn a
#   three-minute signal into a twenty-minute one for every push, including the ones that fail lint
#   in the first thirty seconds. Kept separate, both signals arrive when they are useful.
#
# WHAT IT DOES NOT PROVE
#   Nothing about SQL against real Supabase (migrations-apply-proof.yml job 2 owns that), nothing
#   about the cloud backend (which has never made a round trip — HANDOFF §3a), and nothing about
#   RLS: under PGlite the migration role is a superuser, so local play proves the RULES, never the
#   WALLS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR cancels the older run; a push to MAIN never cancels one (2026-10-15). With
# cancelling on main, every merge cancelled the run before it — the last 15 main runs on 10-14/15
# were ALL cancelled, so main had no finished acceptance verdict at all. Main runs now queue.
concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# ── FOUR SHARDS AND ONE VERDICT (2026-10-13) ─────────────────────────────────────────────────────
# The suite ran on ONE runner: 52m22s of `Run the suite` inside a 62-minute job on main (run
# 38081084926), and 74m32s-and-cancelled on the merchant branch. Nothing in it was slow for a
# reason a budget could fix — it was 365-382 tests in one queue. So the suite is split by a
# MEASURED-TIME test list (scripts/ci/shard-plan.mjs) over four parallel runners (`acceptance-shard`), and ONE job named `acceptance`
# — the required check, so branch protection is unchanged — delivers the verdict.
#
# NO ASSERTION IS DROPPED AND THE NON-VACUITY FLOOR GOT STRICTER, not looser:
#   * every shard still fails on any failed test, any skip, or zero tests run — its own floor;
#   * the verdict job then requires all four shards' stats to have ARRIVED, every shard to have run
#     at least one test, zero skipped / unexpected / flaky across them, and — new — the SUM of
#     expected (passed) tests across the shards to EQUAL the number of tests `playwright test
#     --list` finds in tests/. A shard that silently ran nothing, or a split that lost a file,
#     can no longer read as green.
#
# ── ONE MERCHANTS-ON WORLD, AND THE DB SPECS ON THEIR OWN RUNNER (2026-10-15) ────────────────────
# Measured on run 38689111316 (four shards, 40-61 minutes each), the wall clock was two things:
#   * the merchants-on world (tests/npcOn.fixture.ts) built from scratch by the first test to ask
#     on EVERY shard, by BOTH workers at once — map.wrap 33m, map.hulls 30m, map.perf 30m (red),
#     map.sun 14m, map.merchants 14m, for one world that does not change within a run;
#   * db.chain.spec.ts, whose growth test applies the chain from 0041 under a live house: 55m;
#   * and, hidden from every reported duration, rpc.firstSession / rpc.surface / sea.dateline
#     applying the WHOLE chain in a beforeAll (~40m each on run 38699813083).
# So `npc-on-world` builds that world ONCE, through the fixture's own code and checks, and hands it
# to the npc pool through a per-run cache entry (`npcOn()` finds it on disk); the specs that do not
# need it (plain) and the pure-Node db.* specs (db) start at once; and the three rpc/sea specs boot
# from the build's own image (tests/builtWorld.fixture.ts). The pools are disjoint by file name
# (.github/actions/acceptance-pool, scripts/ci/shard-plan.mjs --files / --not-files), and the
# verdict now requires all six shards' counts to sum to `playwright test --list`.
#
#
# THE GROWTH TEST (stated, not hidden): db.chain's "the world grows under a live house" re-applies
# the whole chain from 0041 and proves a live house survives it (45-65 min). Since 2026-10-17 a PR
# runs it only when the CHAIN MACHINERY changed — src/lib/db/**, tests/frozenChain.ts, scripts/db/**,
# package(-lock).json, vite.config.ts, an edited (not added) migration, or tests/db.chain.spec.ts
# beyond the routine `// And to 0NNN` + `const LAST =` bump every migration PR makes. A new
# migration ALONE no longer runs it: that file is applied on main's snapshot with its self-asserts
# by migrations-apply-proof, and db.chain's other tests apply it; main's full run then re-proves
# the growth. The verdict lists with the same --grep-invert and says so in its log.
jobs:
  # ── THE SELECTION — one job, one file, read by everything below ──────────────────────────────
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.sel.outputs.mode }}
      specs: ${{ steps.sel.outputs.specs }}
      grep_invert: ${{ steps.sel.outputs.grep_invert }}
      npc_world: ${{ steps.sel.outputs.npc_world }}
    steps:
      # Full history: the positive controls read real commits of this repo, and the diff needs the
      # merge commit's first parent.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: The selector still gives the known answer for real commits (positive controls)
        run: node scripts/ci/select-specs.mjs self-test

      # Diffed against the merge commit's FIRST PARENT, not `pull_request.base.sha`: that sha is
      # the base when the PR was last opened/synced and can be older than the main GitHub merged
      # onto — run 38711128598 then counted main's own new migration as this PR's.
      - name: Which specs this run covers, and why
        id: sel
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/select-specs.mjs --base HEAD^1 --head HEAD --out selection.json | tee selection.txt
          else
            node scripts/ci/select-specs.mjs --full --out selection.json | tee selection.txt
          fi
          {
            echo "mode=$(jq -r .mode selection.json)"
            echo "specs=$(jq -r '.specs | length' selection.json)"
            echo "grep_invert=$(jq -r .growth.grepInvert selection.json)"
            echo "npc_world=$(jq -r .npcWorld.run selection.json)"
          } >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .mode selection.json)" = "scoped" ]; then
            echo "::notice title=Scoped acceptance::$(jq -r '.specs | length' selection.json) affected spec file(s) of $(ls tests/*.spec.ts | wc -l) — see this job's log for why each was selected; main runs them all"
          fi
          { echo '### Spec selection'; echo '```'; cat selection.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Hand the selection to every shard and the verdict
        uses: actions/upload-artifact@v4
        with:
          name: spec-selection
          path: |
            selection.json
            selection.txt
          retention-days: 3

  npc-on-world:
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      NEEDED: ${{ needs.select.outputs.npc_world }}
    steps:
      - name: Is the merchants-on world needed by this run?
        run: |
          if [ "$NEEDED" = "true" ]; then echo "yes: an npc-pool spec is selected — building it"
          else echo "no affected specs in the npc pool: the merchants-on world is not built on this run"; fi

      - uses: actions/checkout@v4
        if: env.NEEDED == 'true'

      - uses: actions/setup-node@v4
        if: env.NEEDED == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (from the lockfile)
        if: env.NEEDED == 'true'
        run: npm ci

      # The same cache and key as the shards, build.yml and deploy-pages.yml (see below for why).
      - name: Restore the pre-built world image (keyed by the chain)
        if: env.NEEDED == 'true'
        id: world
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.cache/byeharu-world-image
          key: world-image-${{ hashFiles('supabase/migrations/*.sql') }}
          restore-keys: world-image-

      - name: Build the app (local-PGlite mode) — the world image the fixture opens
        if: env.NEEDED == 'true'
        run: npm run build

      # This job saves it now, not shard 1: it builds first, and every shard restores after it.
      - name: Save the pre-built world image
        if: env.NEEDED == 'true' && steps.world.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/byeharu-world-image
          key: world-image-${{ hashFiles('supabase/migrations/*.sql') }}

      # No browser: the fixture is Node + PGlite. One worker, one build, every fixture check.
      - name: Build the merchants-on world once
        if: env.NEEDED == 'true'
        run: npx playwright test -c playwright.npc-on.config.ts

      # A per-RUN key: the merchants sail on now(), so this world is never handed to another run
      # (npcOn.fixture.ts's 90-minute age check still applies on the shards — tar keeps the mtime).
      # A cache, not an artifact: artifacts count against the storage quota that turned a green
      # suite red on 2026-08-22; cache entries are evicted instead.
      - name: Hand it to the shards
        if: env.NEEDED == 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.cache/byeharu-npc-on
          key: npc-on-${{ github.run_id }}-${{ github.run_attempt }}

  # ── THE POOLS ─────────────────────────────────────────────────────────────────────────────────
  # db    — the pure-Node db.* specs. No browser, no wait.
  # plain — every spec that does NOT open the merchants-on world. No wait.
  # npc   — the specs that import tests/npcOn.fixture.ts. They wait for npc-on-world.
  # One composite action (.github/actions/acceptance-pool) runs every shard of every pool, so the
  # steps and the floors cannot drift apart. The cut is by file name and the three cuts are each
  # other's complement (see the action); the verdict sums all of them against the denominator.
  # On a PR each pool runs only its share of the selection; an empty share succeeds, saying so.
  acceptance-db:
    name: acceptance-shard (db)
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: The growth test on this run
        env:
          GREP_INVERT: ${{ needs.select.outputs.grep_invert }}
        run: |
          if [ -n "$GREP_INVERT" ]; then
            echo "::notice title=Growth test deferred to main::this PR touches no chain machinery (see the select job's log); main's run proves it"
          else
            echo "the growth test runs on this run"
          fi
      - uses: ./.github/actions/acceptance-pool
        with:
          kind: db
          index: 1
          total: 1
          grep-invert: ${{ needs.select.outputs.grep_invert }}

  acceptance-shard:
    name: acceptance-shard (${{ matrix.shard }}/3)
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # The budget history (25 -> 40 -> 75 -> 120, 2026-08-25 to 2026-10-12) is in git history; every
    # raise was a world being built inside a shard — db.chain's from-zero builds, three rpc/sea
    # specs applying the whole chain in a beforeAll (~40 min each since 0105, hidden from every
    # test's reported duration), and the merchants-on world on every worker. All three now live
    # elsewhere (the db pool, tests/builtWorld.fixture.ts, npc-on-world), so this should come DOWN
    # once CI has measured the new split.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/acceptance-pool
        with:
          kind: plain
          index: ${{ matrix.shard }}
          total: 3

  acceptance-npc:
    name: acceptance-shard (npc ${{ matrix.shard }}/2)
    needs: [select, npc-on-world]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/acceptance-pool
        with:
          kind: npc
          index: ${{ matrix.shard }}
          total: 2

  # ═══════════════════════════════════════════════════════════════════════════════════════════
  # THE VERDICT — named `acceptance`, the check branch protection requires.
  # ═══════════════════════════════════════════════════════════════════════════════════════════
  acceptance:
    name: acceptance
    needs: [select, npc-on-world, acceptance-shard, acceptance-npc, acceptance-db]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (from the lockfile)
        run: npm ci

      - name: Collect every shard's counts
        uses: actions/download-artifact@v4
        with:
          pattern: shard-stats-*
          path: shard-stats
          merge-multiple: true

      # If `select` itself failed there is no selection to judge against, and this step's absence
      # of the file fails the verdict below — never a green over an unknown denominator.
      - name: Collect the selection
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: spec-selection
          path: spec-selection

      - name: All six shards ran, and together they ran EVERY selected test
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          NPC_WORLD_RESULT: ${{ needs.npc-on-world.result }}
          SHARDS_RESULT: ${{ needs.acceptance-shard.result }}
          NPC_RESULT: ${{ needs.acceptance-npc.result }}
          DB_RESULT: ${{ needs.acceptance-db.result }}
          GREP_INVERT: ${{ needs.select.outputs.grep_invert }}
        run: |
          set -euo pipefail
          ls -la shard-stats || true
          fail=0
          if [ "$SELECT_RESULT" != "success" ] || [ ! -f spec-selection/selection.json ]; then
            echo "::error title=No selection::the select job finished '$SELECT_RESULT' — there is no denominator to judge the shards against"; exit 1
          fi
          mode="$(jq -r .mode spec-selection/selection.json)"
          echo "selection: $mode — $(jq -r '.specs | length' spec-selection/selection.json) spec file(s)"
          total_expected=0
          total_planned=0
          for i in plain-1 plain-2 plain-3 npc-1 npc-2 db-1; do
            f="shard-stats/shard-$i.json"
            if [ ! -f "$f" ]; then
              echo "::error title=Missing shard::shard $i handed back no counts — it did not run to the end"; fail=1; continue
            fi
            if [ "$(jq -r '.stats == null' "$f")" = "true" ]; then
              echo "::error title=No JSON report::shard $i produced no Playwright report"; fail=1; continue
            fi
            p=$(jq -r '.planned // "?"' "$f")
            e=$(jq -r '.stats.expected // 0' "$f"); s=$(jq -r '.stats.skipped // 0' "$f")
            u=$(jq -r '.stats.unexpected // 0' "$f"); fl=$(jq -r '.stats.flaky // 0' "$f")
            echo "shard $i: planned=$p expected=$e skipped=$s unexpected=$u flaky=$fl"
            # A shard that passed nothing is green ONLY when a PR's scoped selection planned it
            # nothing. On main (full) an empty shard is refused by shard-plan.mjs itself.
            if [ "$e" -eq 0 ]; then
              if [ "$mode" = "scoped" ] && [ "$p" = "0" ]; then echo "  shard $i: no affected specs in this pool"
              else echo "::error title=Vacuous shard::shard $i passed 0 tests (planned $p)"; fail=1; fi
            fi
            [ "$s" -eq 0 ] || { echo "::error title=Skipped test(s)::shard $i skipped $s"; fail=1; }
            [ "$u" -eq 0 ] || { echo "::error title=Failed test(s)::shard $i had $u unexpected result(s)"; fail=1; }
            [ "$fl" -eq 0 ] || { echo "::error title=Flaky test(s)::shard $i had $fl flaky result(s)"; fail=1; }
            total_expected=$((total_expected + e))
            [ "$p" = "?" ] || total_planned=$((total_planned + p))
          done
          # The denominator, from tests/ itself and not from the shards: a split that lost a file
          # would otherwise sum to a smaller, perfectly green number. Listed with the same
          # --grep-invert the db pool ran under, which is empty unless the growth test was deferred.
          if [ -n "$GREP_INVERT" ]; then
            echo "::notice title=Deferred to main::\"$GREP_INVERT\" is not run on this PR (see the select job's log for why); the denominator below excludes it"
          fi
          if [ "$mode" = "full" ]; then
            listed=$(npx playwright test --list ${GREP_INVERT:+--grep-invert "$GREP_INVERT"} | sed -n 's/^Total: \([0-9][0-9]*\) tests\{0,1\} in .*/\1/p' | tail -1)
            what="tests in tests/ (playwright test --list)"
            if [ -z "$listed" ] || [ "$listed" -eq 0 ]; then
              echo "::error title=No denominator::playwright test --list found no tests"; fail=1; listed=0
            fi
          else
            # Every test `playwright test --list` finds in the SELECTED files — counted from the
            # list itself, not from the shard plan.
            listed=$(node scripts/ci/select-specs.mjs count spec-selection/selection.json ${GREP_INVERT:+--grep-invert "$GREP_INVERT"})
            what="tests in the $(jq -r '.specs | length' spec-selection/selection.json) selected spec file(s) (playwright test --list)"
          fi
          echo "$what: ${listed:-?}   planned across the shards: $total_planned   passed across the shards: $total_expected"
          if [ "$total_expected" -ne "$listed" ]; then
            echo "::error title=Tests unaccounted for::$listed test(s) to run but $total_expected passed across the six shards"; fail=1
          fi
          for r in "select:$SELECT_RESULT" "npc-on-world:$NPC_WORLD_RESULT" "the shard matrix:$SHARDS_RESULT" "the npc pool:$NPC_RESULT" "the db pool:$DB_RESULT"; do
            if [ "${r##*:}" != "success" ]; then
              echo "::error title=Job failed::${r%:*} finished '${r##*:}'"; fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          if [ "$mode" = "scoped" ] && [ "$listed" -eq 0 ]; then
            echo "OK: no affected specs — this PR changes nothing a spec can reach (the select job says why); every shard reported, none ran a test. Main's full run checks that claim."
          else
            echo "OK: $total_expected of $listed test(s) passed across the db, plain and npc pools (6 shards), none skipped ($mode)."
          fi
