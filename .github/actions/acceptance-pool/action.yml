name: Acceptance pool
description: >
  Run one pool (one shard of one kind) of the Playwright suite against a served local-PGlite build
  and hand its counts to the `acceptance` verdict. Shared by acceptance.yml's three shard jobs so
  their steps cannot drift apart. See acceptance.yml for WHY the suite is cut into pools, and
  scripts/ci/select-specs.mjs for which specs a PR runs.

inputs:
  kind:
    description: "db | plain | npc — which pool (see acceptance.yml, THE POOLS)"
    required: true
  index:
    description: "this shard's 1-based index within its pool"
    required: true
  total:
    description: "how many shards the pool is cut into"
    required: true
  grep-invert:
    description: "a test title to leave out (the db pool's deferral); empty = none"
    required: false
    default: ''
  prefix-cache:
    description: >
      BYEHARU_PREFIX_CACHE for the build: 'required' on a pull request (the law — the world image
      is built from a cached prefix or the build FAILS, never from zero), '' on main or when the
      PR changed the chain machinery (docs/CI.md, "The law")
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24  # 0039: Node scripts import src/lib/sea/*.ts via type stripping (default from 23.6)
        cache: npm

    - name: Install dependencies (from the lockfile)
      shell: bash
      run: npm ci

    # THE SELECTION (2026-10-17): the `select` job's selection.json — which specs this run covers
    # (all of them on main; the affected ones on a PR) and the npc pool's member list. One file, one
    # authority, read by every shard and by the verdict.
    - name: Fetch this run's spec selection
      uses: actions/download-artifact@v4
      with:
        name: spec-selection
        path: spec-selection

    # THE POOLS ARE CUT BY FILE NAME, and the three cuts are complements of each other by
    # construction: db = ^db\. ; npc = every spec that imports tests/npcOn.fixture.ts (listed by
    # select-specs.mjs from THIS checkout, so a new merchants-on spec joins the npc pool without
    # anyone listing it) ; plain = everything else. Inside a pool the split is by MEASURED TIME
    # (scripts/ci/shard-plan.mjs, tests/shard-weights.json), narrowed on a PR to the selected spec
    # files (--select). The verdict independently requires the pools' passes to sum to the
    # denominator, so a cut that lost or doubled a file is red.
    #
    # PLANNED FIRST (2026-10-17), before the cache, the browser and the build: a PR shard whose
    # plan is empty skips all three and reports "planned 0" — minutes, not a build, for nothing.
    - name: Plan this shard
      id: plan
      shell: bash
      env:
        KIND: ${{ inputs.kind }}
        GREP_INVERT: ${{ inputs.grep-invert }}
      run: |
        set -euo pipefail
        npc="$(jq -r '.pools.npc[]' spec-selection/selection.json | sed 's/\./\\./g' | paste -sd'|')"
        [ -n "$npc" ] || { echo "::error::selection.json lists no npc-pool spec — the npc pool has nothing to cut"; exit 1; }
        case "$KIND" in
          db)    cut='--files=^db\.' ;;
          npc)   cut="--files=^($npc)\$" ;;
          plain) cut="--not-files=^db\\.|^($npc)\$" ;;
          *)     echo "unknown pool $KIND"; exit 1 ;;
        esac
        echo "pool $KIND, shard ${{ inputs.index }}/${{ inputs.total }}: $cut   (selection: $(jq -r .mode spec-selection/selection.json))"
        node scripts/ci/shard-plan.mjs ${{ inputs.index }} ${{ inputs.total }} shard-tests.txt "$cut" \
          --select=spec-selection/selection.json ${GREP_INVERT:+"--grep-invert=$GREP_INVERT"}
        echo "planned=$(cat shard-tests.txt.count)" >> "$GITHUB_OUTPUT"

    # THE SAME CACHE AND KEY as build.yml and deploy-pages.yml. Restored AFTER npm ci, which removes
    # node_modules whole. `restore-keys` brings back the newest older entry when the chain moved,
    # and its prefix snapshots (scripts/db/prefix-cache.mjs) mean only the new files are applied.
    # npc-on-world saves it; every pool only restores.
    - name: Restore the pre-built world image (keyed by the chain)
      if: steps.plan.outputs.planned != '0'
      uses: actions/cache/restore@v4
      with:
        path: node_modules/.cache/byeharu-world-image
        key: world-image-${{ hashFiles('supabase/migrations/*.sql') }}
        restore-keys: world-image-

    # THE GROWTH TEST'S SNAPSHOTS (2026-10-18; the owner: "save everything when you checked so that
    # CI becomes always faster"). db.chain's "the world grows under a live house" applies the growth
    # (0041 → the head) THROUGH the prefix cache (tests/db.chain.spec.ts says why that is the same
    # proof): it restores the longest growth prefix a previous run already applied on the same house
    # and applies only the files after it. Cold it was 32-78 min of the db shard; this cache is what
    # makes it minutes. Keyed on the chain AND on everything that decides what a snapshot holds (the
    # spec's own setup, the frozen chain, the applier, the cache module, the engine version), so a
    # changed setup misses the exact key and saves a fresh entry; restore-keys bring back the newest
    # entry for this chain (a partial one a cancelled run saved) and then the newest of any chain —
    # prefix-cache.mjs proves every snapshot it restores against its manifest and its content digest.
    # Only the db pool, only when the growth test is planned (on a PR it is usually deferred to main).
    - name: Restore the growth test's snapshots (the longest growth prefix already applied)
      id: growth
      if: inputs.kind == 'db' && inputs.grep-invert == '' && steps.plan.outputs.planned != '0'
      uses: actions/cache/restore@v4
      with:
        path: node_modules/.cache/byeharu-growth-house
        key: growth-house-${{ hashFiles('supabase/migrations/*.sql', 'tests/db.chain.spec.ts', 'tests/frozenChain.ts', 'src/lib/db/applyChain.ts', 'src/lib/db/chain.ts', 'scripts/db/prefix-cache.mjs', 'package-lock.json') }}
        restore-keys: |
          growth-house-${{ hashFiles('supabase/migrations/*.sql', 'tests/db.chain.spec.ts', 'tests/frozenChain.ts', 'src/lib/db/applyChain.ts', 'src/lib/db/chain.ts', 'scripts/db/prefix-cache.mjs', 'package-lock.json') }}-
          growth-house-

    # chromium ONLY, and only for the pools that open a page. The db.* specs are pure Node.
    - name: Install the browser
      if: inputs.kind != 'db' && steps.plan.outputs.planned != '0'
      shell: bash
      run: npx playwright install --with-deps chromium

    # The SAME build deploy-pages.yml publishes, produced the same way — no VITE_SUPABASE_URL and
    # no VITE_SUPABASE_ANON_KEY, so `hasCloud` is false and the app boots the local PGlite engine.
    # This is deliberate and load-bearing: a cloud build redirects every route to /auth, where
    # there is no world and no table, and layout.spec.ts would SKIP itself rather than measure.
    # The no-skips floor below is what makes that impossible to miss. The db pool needs it too:
    # db.image.spec.ts certifies the image THIS build emitted, and the rpc specs boot from it.
    - name: Build the app under test (local-PGlite mode)
      if: steps.plan.outputs.planned != '0'
      shell: bash
      env:
        BYEHARU_PREFIX_CACHE: ${{ inputs.prefix-cache }}
      run: npm run build

    # The world npc-on-world built for THIS run. fail-on-cache-miss: a shard that silently rebuilt
    # it would be the 30-minute cost the npc pool exists to remove.
    - name: Restore this run's merchants-on world
      if: inputs.kind == 'npc' && steps.plan.outputs.planned != '0'
      uses: actions/cache/restore@v4
      with:
        path: node_modules/.cache/byeharu-npc-on
        key: npc-on-${{ github.run_id }}-${{ github.run_attempt }}
        fail-on-cache-miss: true

    # `--strictPort` so a taken port fails here, loudly, instead of leaving the suite pointed at
    # nothing. The host and port must match playwright.config.ts's PLAYWRIGHT_BASE_URL default;
    # that env var is left unset on purpose so the config stays the single authority for the URL.
    # If they ever disagree, every browser test skips — which the no-skips floor turns red.
    - name: Serve the build
      if: inputs.kind != 'db' && steps.plan.outputs.planned != '0'
      shell: bash
      run: |
        set -euo pipefail
        nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
        echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:4173/byeharu-voyage/ > /dev/null; then
            echo "served after ${i}s"
            exit 0
          fi
          sleep 1
        done
        echo "::error title=Nothing served::vite preview never answered on 127.0.0.1:4173"
        cat /tmp/preview.log
        exit 1

    # Reporters are set on the CLI rather than in playwright.config.ts so the config keeps
    # describing how a developer runs the suite. `json` is here only to be read by the next steps.
    - name: Run this shard of the suite
      if: steps.plan.outputs.planned != '0'
      shell: bash
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-results.json
        GREP_INVERT: ${{ inputs.grep-invert }}
      run: |
        set -euo pipefail
        npx playwright test --test-list shard-tests.txt ${GREP_INVERT:+--grep-invert "$GREP_INVERT"} --reporter=list,html,json

    # THE NON-VACUITY FLOOR, PER SHARD. Green is not "playwright exited 0" — it is "the tests that
    # matter actually ran". Every skip in tests/ lives in layout.spec.ts and every one of them
    # fires on a condition this job exists to rule out: nothing served, or a cloud build sitting
    # on /auth. So a skip here is a failure, and so is a shard that ran nothing — UNLESS its plan
    # was empty, which only a PR's scoped selection can produce (shard-plan.mjs refuses an empty
    # plan otherwise). "Planned 0, ran 0" is reported as exactly that, never as a pass of tests.
    - name: Every test in this shard ran — no skips, and not zero tests
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        planned="${{ steps.plan.outputs.planned }}"
        if [ "$planned" = "0" ]; then
          echo "no affected specs in this pool: ${{ inputs.kind }} ${{ inputs.index }}/${{ inputs.total }} planned 0 test(s) under this PR's selection, and ran none."
          exit 0
        fi
        test -f playwright-results.json || {
          echo "::error title=No JSON report::${{ inputs.kind }} ${{ inputs.index }}/${{ inputs.total }} did not run to completion"; exit 1; }
        expected=$(jq -r '.stats.expected // 0' playwright-results.json)
        skipped=$(jq -r '.stats.skipped  // 0' playwright-results.json)
        echo "${{ inputs.kind }} ${{ inputs.index }}/${{ inputs.total }} — planned: $planned   expected: $expected   skipped: $skipped"
        if [ "$expected" -eq 0 ]; then
          echo "::error title=Vacuous shard::0 tests passed. A green tick over nothing is not a proof."
          exit 1
        fi
        if [ "$skipped" -ne 0 ]; then
          echo "::error title=Skipped test(s)::$skipped test(s) skipped. Every skip in tests/ means the app was not served, or was built in cloud mode — neither is a pass."
          jq -r '[.. | objects | select(has("tests") and has("title"))]
                 | .[] | select(any(.tests[]?; .status == "skipped"))
                 | "  skipped: \(.title)"' playwright-results.json || true
          exit 1
        fi
        echo "OK: $expected test(s) ran, none skipped."

    # SAVED WHENEVER THE RUN GOT FURTHER THAN THE CACHE IT STARTED FROM — on success under the exact
    # key, and on a failure or a CANCELLATION under a per-run partial key, so the growth files a
    # cancelled run (a newer merge superseded it) had already applied are not applied again: the next
    # run's restore-keys find the partial entry. Every snapshot in the directory is complete by
    # construction (prefix-cache.mjs writes the tarball, then the manifest, each by rename) and is
    # proven again on load, so a cut-short run can only leave fewer of them, never a wrong one.
    - name: Save the growth test's snapshots
      if: success() && inputs.kind == 'db' && inputs.grep-invert == '' && steps.plan.outputs.planned != '0' && steps.growth.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: node_modules/.cache/byeharu-growth-house
        key: ${{ steps.growth.outputs.cache-primary-key }}

    - name: Save the growth test's snapshots (a failed or cancelled run's progress)
      if: always() && !success() && inputs.kind == 'db' && inputs.grep-invert == '' && steps.plan.outputs.planned != '0' && steps.growth.outputs.cache-primary-key != ''
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: node_modules/.cache/byeharu-growth-house
        key: ${{ steps.growth.outputs.cache-primary-key }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

    # The shard's COUNTS only — a few hundred bytes — for the verdict job. Never the report: a
    # report on every run is what hit the artifact quota on 2026-08-22. `planned` travels with them
    # so the verdict can tell an empty plan from a shard that died.
    - name: Hand this shard's counts to the verdict
      if: always()
      shell: bash
      run: |
        set -euo pipefail
        id="${{ inputs.kind }}-${{ inputs.index }}"
        planned="${{ steps.plan.outputs.planned }}"
        mkdir -p shard-stats
        if [ "$planned" = "0" ]; then
          echo "{\"shard\": \"$id\", \"planned\": 0, \"stats\": {\"expected\": 0, \"skipped\": 0, \"unexpected\": 0, \"flaky\": 0}}" > "shard-stats/shard-$id.json"
        elif [ -f playwright-results.json ]; then
          jq --arg id "$id" --argjson planned "${planned:-null}" '{shard: $id, planned: $planned, stats: .stats}' playwright-results.json > "shard-stats/shard-$id.json"
        else
          echo "{\"shard\": \"$id\", \"planned\": ${planned:-null}, \"stats\": null}" > "shard-stats/shard-$id.json"
        fi
        cat "shard-stats/shard-$id.json"

    - name: Upload this shard's counts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: shard-stats-${{ inputs.kind }}-${{ inputs.index }}
        path: shard-stats/
        retention-days: 1

    # ONLY ON FAILURE, AND NEVER ALLOWED TO FAIL THE JOB (2026-08-22): an always() upload hit the
    # artifact quota and turned a green suite red. A storage problem must never mask a test result.
    - name: Upload the Playwright report (only when something failed)
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report-${{ inputs.kind }}-${{ inputs.index }}
        path: |
          playwright-report/
          playwright-results.json
        retention-days: 7

    # NEVER `kill 0`: with no server started (the db pool) that signals the whole process group,
    # the job's own shell included — exit 143 on run 38711128598 after every db test had passed.
    - name: Stop the preview server (always)
      if: always() && inputs.kind != 'db'
      shell: bash
      run: if [ -n "${PREVIEW_PID:-}" ]; then kill "$PREVIEW_PID" 2>/dev/null || true; fi
