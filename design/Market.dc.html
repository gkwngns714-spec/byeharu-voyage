<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #e2ab52; } a:hover { color: #f2c479; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums slashed-zero; }
    .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, ui-serif, serif; }
    .row { transition: border-color .15s; cursor: pointer; }
    .row:hover { border-color: rgba(226,171,82,.5); }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; overflow: hidden; background: #0d141d; color: #f1ebdd; font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;">

  <div style="flex-shrink: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid #253547;">
    <div>
      <p class="mono" style="margin: 0 0 2px; font-size: 10px; letter-spacing: .2em; color: #8b97a5;">LISBON · TAX 3.0%</p>
      <h2 class="serif" style="margin: 0; font-size: 22px; font-weight: 600;">The Market</h2>
    </div>
    <span class="mono" style="font-size: 15px; color: #e2ab52; font-weight: 500;">7,451 d.</span>
  </div>

  <!-- ── THE FIX FOR THE THING THAT COST A VOYAGE ──────────────────────────────────────────
       The old table put %NBR — the one number the whole game turns on — in a sixth column
       that fell off the right edge of a 390px phone. Here it is a BAR, first, at full width,
       and the price is the small print. You read the shape before you read a digit. ────── -->
  <div style="flex-shrink: 0; display: flex; gap: 6px; padding: 12px 16px 0;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
      <div onClick="{{t.pick}}" style="flex-grow: 1; min-height: 36px; display: flex; align-items: center; justify-content: center; border: 1px solid {{t.edge}}; border-radius: 8px; background: {{t.fill}}; cursor: pointer;">
        <span class="mono" style="font-size: 11px; letter-spacing: .14em; color: {{t.ink}};">{{t.label}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{goods}}" as="g" hint-placeholder-count="5">
      <div class="row" onClick="{{g.pick}}" style="padding: 11px 12px; border: 1px solid {{g.edge}}; border-radius: 10px; background: #16202c;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px;">
          <span class="serif" style="font-size: 16px; font-weight: 600; color: #f1ebdd;">{{g.name}}</span>
          <span class="mono" style="flex-shrink: 0; font-size: 15px; color: {{g.tint}};">{{g.pct}}</span>
        </div>
        <div style="margin-top: 7px; height: 5px; border-radius: 3px; background: #070b11; overflow: hidden;">
          <div style="{{g.barStyle}}"></div>
        </div>
        <div style="margin-top: 7px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <span class="mono" style="font-size: 11px; color: #8b97a5;">{{g.price}}</span>
          <span class="mono" style="font-size: 11px; color: {{g.tint}};">{{g.where}}</span>
        </div>

        <!-- ── the bookkeeper's answer, and the only honest quote ──────────────────────────
             The headline price is for ONE tun. A real parcel walks the book both ways, and
             the old screen only admitted it after the money was gone. Here the parcel is
             priced before you commit: what you pay, what she fetches, what is left. ───── -->
        <sc-if value="{{g.open}}" hint-placeholder-val="{{true}}">
          <div style="margin-top: 11px; padding-top: 11px; border-top: 1px solid #253547;">
            <p class="mono" style="margin: 0 0 8px; font-size: 10px; letter-spacing: .18em; color: #8b97a5;">A PARCEL OF 50 TUNS, PRICED</p>
            <div style="display: flex; flex-direction: column; gap: 5px;">
              <sc-for list="{{g.quote}}" as="q" hint-placeholder-count="4">
                <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
                  <span style="font-size: 12px; color: #b3bcc7;">{{q.label}}</span>
                  <span class="mono" style="font-size: 12px; color: {{q.tint}};">{{q.value}}</span>
                </div>
              </sc-for>
            </div>
            <div style="margin-top: 12px; display: flex; gap: 8px;">
              <div style="flex-grow: 1; min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: #e2ab52;">
                <span style="font-size: 14px; font-weight: 500; color: #070b11;">{{g.action}}</span>
              </div>
              <div style="flex-shrink: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; padding: 0 16px; border: 1px solid #253547; border-radius: 6px; background: #16202c;">
                <span style="font-size: 14px; color: #f1ebdd;">Change</span>
              </div>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-for>

    <div style="margin-top: 4px; padding: 11px 12px; border: 1px dashed #253547; border-radius: 10px; text-align: center;">
      <span class="mono" style="font-size: 11px; color: #8b97a5;">66 more, none of them dearer elsewhere</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props)
    this.state = { side: 'buy', open: 'pepper' }
  }

  renderVals() {
    const rows = [
      { id: 'pepper', name: 'Black Pepper', pctN: 83, price: '131 d. the tun · glut', where: 'Tangier pays +21%',
        quote: [
          { label: 'You pay here, all in', value: '6,659 d.', tint: '#f1ebdd' },
          { label: 'Which is a tun at', value: '133 d. — not 131', tint: '#e8bd53' },
          { label: 'Tangier fetches', value: '7,410 d.', tint: '#f1ebdd' },
          { label: 'After tax, wages, 2.4 days', value: '+ 636 d.', tint: '#5cc48d' },
        ] },
      { id: 'porcelain', name: 'Porcelain', pctN: 84, price: '367 d. the tun · glut', where: 'Sevilla pays +18%',
        quote: [
          { label: 'You pay here, all in', value: '7,451 d. — your whole purse', tint: '#e8bd53' },
          { label: 'Which is a tun at', value: '372 d. — not 367', tint: '#e8bd53' },
          { label: 'Sevilla fetches', value: '8,180 d.', tint: '#f1ebdd' },
          { label: 'After tax, wages, 2.9 days', value: '+ 512 d.', tint: '#5cc48d' },
        ] },
      { id: 'oil', name: 'Olive Oil', pctN: 88, price: '92 d. the tun · glut', where: 'Ceuta pays +9%',
        quote: [
          { label: 'You pay here, all in', value: '4,640 d.', tint: '#f1ebdd' },
          { label: 'Which is a tun at', value: '93 d. — not 92', tint: '#8b97a5' },
          { label: 'Ceuta fetches', value: '4,880 d.', tint: '#f1ebdd' },
          { label: 'After tax, wages, 2.1 days', value: '+ 61 d. — barely worth the water', tint: '#e8bd53' },
        ] },
      { id: 'salt', name: 'Salt', pctN: 89, price: '28 d. the tun · glut', where: 'Sale pays +7%',
        quote: [
          { label: 'You pay here, all in', value: '1,420 d.', tint: '#f1ebdd' },
          { label: 'Which is a tun at', value: '28 d.', tint: '#8b97a5' },
          { label: 'Sale fetches', value: '1,500 d.', tint: '#f1ebdd' },
          { label: 'After tax, wages, 2.5 days', value: '− 44 d. — a losing voyage', tint: '#ef7f74' },
        ] },
    ]

    const goods = rows.map((r) => {
      const open = this.state.open === r.id
      const deep = r.pctN <= 85
      const tint = deep ? '#5cc48d' : '#e8bd53'
      // the bar reads from 100% down: the further left it stops, the cheaper this port is
      const w = Math.max(6, Math.min(100, 100 - (100 - r.pctN) * 4))
      return {
        ...r,
        open,
        tint,
        pct: r.pctN + '%',
        edge: open ? 'rgba(226,171,82,.45)' : '#253547',
        barStyle: 'height: 100%; width: ' + w + '%; background: ' + tint + '; opacity: .8;',
        action: 'Buy 50 t and sail',
        pick: () => this.setState({ open: open ? null : r.id }),
      }
    })

    const tabs = ['buy', 'sell'].map((k) => {
      const on = this.state.side === k
      return {
        label: k === 'buy' ? 'WORTH BUYING' : 'IN THE HOLD',
        edge: on ? 'rgba(226,171,82,.45)' : '#253547',
        fill: on ? 'rgba(226,171,82,.10)' : '#16202c',
        ink: on ? '#e2ab52' : '#8b97a5',
        pick: () => this.setState({ side: k }),
      }
    })

    return { goods, tabs }
  }
}
</script>
</body>
</html>
